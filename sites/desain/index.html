<style>
/* Light theme for the design editor (page-local token overrides). */

body { font-size: 13.5px; background: var(--well); }

.el .in { position: relative; }
.dimlbl { position: absolute; right: 0; bottom: calc(-26px / var(--z)); transform-origin: 100% 0; transform: scale(calc(1 / var(--z))); background: var(--select); color: #fff; font: 600 11px var(--f-mono); padding: 2px 6px; border-radius: 5px; white-space: nowrap; pointer-events: none; z-index: 3; letter-spacing: 0; text-transform: none; text-shadow: none; -webkit-text-stroke: 0; font-style: normal; text-decoration: none; line-height: 1.3; }
.guide.gap { background: #e0218a; }
.guide.gap::after { content: attr(data-gap); position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(var(--gz)); background: #e0218a; color: #fff; font: 600 10px var(--f-mono); padding: 1px 4px; border-radius: 4px; }

.note { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.45; }

.btn:hover { border-color: #c4c8d0; background: var(--hover); }
.btn.ghost:hover { background: var(--hover); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); }

#rail button:hover { color: var(--fg); } #rail button:hover svg { background: var(--hover); }
#rail button.on { color: var(--fg); } #rail button.on svg { background: #fbefd0; color: var(--accent-strong); }
#side { grid-area: side; background: var(--surface); border-right: 1px solid var(--line); box-shadow: 2px 0 8px #1018280a; z-index: 1; display: flex; flex-direction: column; min-height: 0; }

  box-shadow: 0 0 0 calc(1px / var(--z)) #00000026, 0 calc(1px / var(--z)) calc(5px / var(--z)) #00000047; }

    if (e.effect === 'neon') { x.shadowColor = f.color; x.shadowBlur = s * 2 * k; }
    lines.forEach((l, i) => {
      const lw = x.measureText(l).width, inner = e.w - 2 * pad, lx = pad + (e.align === 'center' ? (inner - lw) / 2 : e.align === 'right' ? inner - lw : 0), ly = pad + i * lh + lh / 2;
      if (e.effect === 'outline') { x.lineJoin = 'round'; x.lineWidth = s; x.strokeStyle = f.color; x.strokeText(l, lx, ly); }
      if (e.effect === 'hollow') { x.lineWidth = Math.max(1, s / 3); x.strokeStyle = e.color; x.strokeText(l, lx, ly); }
      else { x.fillStyle = e.color; x.fillText(l, lx, ly); if (e.effect === 'neon') x.fillText(l, lx, ly); }
      if (e.underline) { x.fillStyle = e.color; x.fillRect(lx, ly + e.fontSize * .5, lw, Math.max(1, e.fontSize / 14)); }
    });
  }
  x.restore();
}

// ---------- export ----------
function openExport(fmt = 'png') {
  const m = Studio.modal(`<h3>Download desain</h3>
    <label class="field"><span>Format</span><select id="xF"><option value="png">PNG (kualitas terbaik)</option><option value="jpg">JPG (ukuran kecil)</option><option value="pdf">PDF (semua halaman)</option></select></label>
    <label class="field"><span>Halaman</span><select id="xP"><option value="all">Semua (${D.pages.length})</option><option value="cur">Halaman ${cur + 1} saja</option></select></label>
    <label class="field"><span>Skala <span class="tier pro">Pro di Canva</span></span><select id="xS"><option value="0.5">0.5× (${D.width / 2}×${D.height / 2})</option><option value="1" selected>1× (${D.width}×${D.height})</option><option value="2">2× (${D.width * 2}×${D.height * 2})</option><option value="3">3×</option></select></label>
    <label class="field" id="xQw" hidden><span>Kualitas JPG</span><input type="range" id="xQ" min="40" max="100" value="90"></label>
    <label class="row" id="xTw"><input type="checkbox" id="xT"> Latar transparan <span class="tier pro">Pro di Canva</span></label>
    <div id="xOut" style="display:grid;gap:8px"></div>
    <div class="actions"><button class="btn" data-c>Tutup</button><button class="btn primary" id="xGo">${icon('download')} Unduh</button></div>`);
  const q = s => m.el.querySelector(s);
  q('[data-c]').onclick = () => m.close();
  q('#xF').onchange = () => { const f = q('#xF').value; q('#xQw').hidden = f !== 'jpg'; q('#xTw').hidden = f !== 'png'; q('#xP').disabled = f === 'pdf'; };
  q('#xF').value = fmt; q('#xF').onchange();
  q('#xGo').onclick = async () => {
    const f = q('#xF').value, k = +q('#xS').value, pages = f === 'pdf' || q('#xP').value === 'all' ? D.pages : [page()], out = q('#xOut');
    q('#xGo').disabled = true; out.innerHTML = '<p>Menyiapkan…</p>';
    try {
      const canv = []; for (const p of pages) canv.push(await renderPage(p, k, {transparent: f === 'png' && q('#xT').checked}));
      const name = (D.title || 'desain').replace(/[^\w\- ]+/g, '').trim() || 'desain';
      out.innerHTML = '';
      if (f === 'pdf') {
        if (!window.jspdf) throw new Error('Library PDF gagal dimuat. Periksa koneksi internet.');
        const doc = new jspdf.jsPDF({orientation: D.width > D.height ? 'l' : 'p', unit: 'px', format: [D.width, D.height], hotfixes: ['px_scaling']});
        canv.forEach((c, i) => { if (i) doc.addPage([D.width, D.height], D.width > D.height ? 'l' : 'p'); doc.addImage(c.toDataURL('image/jpeg', .92), 'JPEG', 0, 0, D.width, D.height); });
        doc.save(name + '.pdf'); out.innerHTML = `<p>PDF ${canv.length} halaman dibuat.</p>`;
      } else {
        canv.forEach((c, i) => {
          const url = c.toDataURL(f === 'png' ? 'image/png' : 'image/jpeg', +q('#xQ').value / 100), a = document.createElement('a');
          a.href = url; a.download = `${name}${canv.length > 1 ? '-' + (i + 1) : ''}.${f}`; a.click();
          out.insertAdjacentHTML('beforeend', `<img src="${url}" alt="Hasil ekspor halaman ${i + 1}" style="width:100%;border-radius:6px;border:1px solid var(--line);background:repeating-conic-gradient(#333 0 25%,#222 0 50%) 0 0/16px 16px">`);
        });
      }
      out.insertAdjacentHTML('beforeend', '<p style="font-size:12px">Jika unduhan tidak berjalan (mode pratinjau), buka Studio lewat Vercel atau komputer Anda. Gambar di atas bisa disimpan dengan klik kanan.</p>');
    } catch (err) { out.innerHTML = `<p style="color:var(--danger)">${esc(err.message)}</p>`; }
    q('#xGo').disabled = false;
  };
}
$('#resizeBtn').onclick = () => openResize();
function openResize() {
  const m = Studio.modal(`<h3>Ubah ukuran</h3><p>Semua elemen ikut menyesuaikan. Fitur ini khusus Pro di Canva, gratis di Rakit.</p>
    <div style="display:grid;gap:6px">${Object.entries(SIZES).map(([k, s]) => `<label class="row"><input type="radio" name="rz" value="${k}" ${k === D.kind ? 'checked' : ''}> <span class="grow">${s.label}</span><span class="mono" style="color:var(--muted)">${s.w}×${s.h}</span></label>`).join('')}
    <label class="row"><input type="radio" name="rz" value="custom"> <span class="grow">Kustom</span><input type="number" id="rzW" value="${D.width}" style="width:76px"> × <input type="number" id="rzH" value="${D.height}" style="width:76px"></label></div>
    <div class="actions"><button class="btn" data-c>Batal</button><button class="btn" id="rzThis">Ubah desain ini</button><button class="btn primary" id="rzCopy">Salin & ubah ukuran</button></div>`);
  const q = s => m.el.querySelector(s); q('[data-c]').onclick = () => m.close();
  const target = () => { const v = q('input[name=rz]:checked').value; return v === 'custom' ? {kind: 'custom', w: Math.max(50, +q('#rzW').value), h: Math.max(50, +q('#rzH').value)} : {kind: v, w: SIZES[v].w, h: SIZES[v].h}; };
  const scaled = (src, t) => { const d = JSON.parse(JSON.stringify(src)), kx = t.w / d.width, ky = t.h / d.height, ku = Math.min(kx, ky);
    for (const p of d.pages) for (const e of p.elements) {
      const cx = (e.x + e.w / 2) * kx, cy = (e.y + e.h / 2) * ky;
      if (e.type === 'text' || e.type === 'image' || e.type === 'ellipse' || e.type === 'star') { e.w *= ku; e.h *= ku; if (e.fontSize) e.fontSize = Math.round(e.fontSize * ku); }
      else { e.w *= kx; e.h *= ky; } e.x = Math.round(cx - e.w / 2); e.y = Math.round(cy - e.h / 2); e.w = Math.round(e.w); e.h = Math.round(e.h);
    }
    Object.assign(d, {width: t.w, height: t.h, kind: t.kind}); return d; };
  q('#rzThis').onclick = () => { snap(); const d = scaled(D, target()); Object.assign(D, d); m.close(); fit(); commit(); };
  q('#rzCopy').onclick = async () => { const t = target(), d = scaled(D, t); d.id = uid(); d.title = `${D.title} (${t.w}×${t.h})`; await Studio.saveDesign(d); m.close(); Studio.go('index.html', {id: d.id}); };
}
async function sendCanva() {
  if (!Studio.connected) return Studio.modal(`<h3>Kirim ke Canva</h3><p>Fitur ini memakai akun Canva Anda lewat bridge di komputer. Jalankan <span class="mono">creative-mcp login</span> sekali, lalu buka Studio dengan <span class="mono">creative-mcp studio</span>.</p><p>Desain dikirim sebagai file PPTX dan menjadi desain Canva biasa yang semua elemennya bisa diedit.</p><div class="actions"><button class="btn primary" onclick="this.closest('.modal-back').remove()">Mengerti</button></div>`);
  Studio.toast('Mengirim ke Canva…', 8000);
  try { const r = await Studio.api('/api/design/canva', {method: 'POST', body: JSON.stringify(D)});
    if (r.error) return Studio.toast('File PPTX dibuat, tapi Canva menolak: ' + r.error, 7000);
    const url = r.canva?.job?.result?.designs?.[0]?.urls?.edit_url;
    Studio.modal(`<h3>Terkirim ke Canva</h3><p>Status: ${esc(r.canva?.job?.status || 'selesai')}</p>${url ? `<p><a href="${esc(url)}" target="_blank" rel="noopener" style="color:var(--accent)">Buka desain di Canva</a></p>` : ''}<div class="actions"><button class="btn primary" onclick="this.closest('.modal-back').remove()">Tutup</button></div>`);
  } catch (err) { Studio.toast('Gagal: ' + err.message, 6000); }
}

// ---------- File menu, new design, copy ----------
function newDesign(kind) {
  if (!kind) {
    const m = Studio.modal(`<h3>Desain baru</h3><p>Pilih ukuran. Desain ini tetap tersimpan.</p><div class="tiles masonry" id="ndz">${Object.entries(SIZES).map(([k, z]) => { const q = 64 / Math.max(z.w, z.h);
      return `<button class="tile sizecard" data-k="${k}"><i style="width:${Math.round(z.w * q)}px;height:${Math.round(z.h * q)}px"></i><span>${z.label}</span><small class="mono">${z.w}×${z.h}</small></button>`; }).join('')}</div>
      <div class="actions"><button class="btn" data-c>Batal</button></div>`);
    m.el.querySelector('[data-c]').onclick = () => m.close();
    m.el.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { m.close(); newDesign(b.dataset.k); });
    return;
  }
  const d = makeDesign(kind, D.palette || 'kunyit');
  Studio.saveDesign(d).then(() => Studio.go('index.html', {id: d.id})).catch(err => Studio.toast('Gagal membuat desain: ' + err.message, 5000));
}
async function copyDesign() {
  const d = JSON.parse(JSON.stringify(D)); d.id = uid(); d.title = `${D.title} (salinan)`; d.updated = Date.now();
  try { await Studio.saveDesign(d); Studio.toast('Salinan dibuat'); Studio.go('index.html', {id: d.id}); } catch (err) { Studio.toast('Gagal menyalin: ' + err.message, 5000); }
}
$('#fileBtn').onclick = ev => {
  if (!$('#cmenu').hidden && $('#cmenu').dataset.owner === 'file') return closeMenu();
  const q = ev.currentTarget.getBoundingClientRect();
  showMenu([['plus', 'Desain baru', '', true, () => newDesign()], ['copy', 'Buat salinan', '', true, copyDesign], ['resize', 'Ubah ukuran', '', true, openResize],
    ['download', 'Ekspor / download', '', true, () => openExport()], '-', 'Riwayat',
    ['undo', 'Urungkan', 'Ctrl+Z', undoS.length > 0, () => $('#undo').click()], ['redo', 'Ulangi', 'Ctrl+Y', redoS.length > 0, () => $('#redo').click()]], q.left, q.bottom + 4);
  $('#cmenu').dataset.owner = 'file';
};

// ---------- share panel ----------
$('#shareBtn').onclick = () => {
  const sp = $('#share'); if (!sp.hidden) return closeShare();
  sp.innerHTML = `<h4>Bagikan desain ini</h4>
    <div class="label">Download</div>
    <div class="dl"><select id="shFmt" aria-label="Format file"><option value="png">PNG</option><option value="jpg">JPG</option><option value="pdf">PDF</option></select><button class="btn primary" id="shDl">${icon('download')} Download</button></div>
    <div class="label">Kirim</div>
    <button class="btn" id="shCanva">${icon('send')} Kirim ke Canva</button>
    <div class="label">Tautan</div>
    <p>Desain disimpan di perangkat ini${Studio.connected ? ' dan di komputer Anda' : ''}. Tautan hanya terbuka di Studio yang sama (bukan tautan publik).</p>
    <button class="btn" id="shLink">${icon('link')} Salin tautan</button>`;
  sp.hidden = false; const r = $('#shareBtn').getBoundingClientRect();
  sp.style.top = (r.bottom + 8) + 'px'; sp.style.left = Math.max(8, Math.min(r.right - sp.offsetWidth, innerWidth - sp.offsetWidth - 8)) + 'px';
  sp.querySelector('#shDl').onclick = () => { const f = sp.querySelector('#shFmt').value; closeShare(); openExport(f); };
  sp.querySelector('#shCanva').onclick = () => { closeShare(); sendCanva(); };
  sp.querySelector('#shLink').onclick = async () => {
    const u = new URL(location.href); u.searchParams.set('id', D.id);
    try { await navigator.clipboard.writeText(u.href); Studio.toast('Tautan disalin'); } catch { Studio.toast('Tidak bisa menyalin otomatis. Tautan: ' + u.href, 7000); }
  };
  sp.querySelector('select').focus();
};
function closeShare() { $('#share').hidden = true; }

// ---------- notes ----------
function syncNotes() {
  const n = $('#notes'); if (n.hidden) return;
  $('#notesT').textContent = `Catatan halaman ${cur + 1}`; const ta = $('#notesTa');
  if (document.activeElement !== ta) ta.value = page().notes || '';
}
$('#notesBtn').onclick = () => { const n = $('#notes'); n.hidden = !n.hidden; $('#notesBtn').classList.toggle('on', !n.hidden); $('#notesBtn').setAttribute('aria-expanded', String(!n.hidden)); syncNotes(); if (!n.hidden) $('#notesTa').focus(); };
$('#notesX').onclick = () => $('#notesBtn').click();
$('#notesTa').onfocus = () => snap();
$('#notesTa').oninput = () => { page().notes = $('#notesTa').value; save(); };
$('#notesTa').onchange = () => commit();

// ---------- grid view of all pages ----------
function openGrid() {
  const g = $('#gridv'), gg = g.querySelector('.gg'); gg.innerHTML = ''; g.hidden = false; $('#pgBtn').setAttribute('aria-pressed', 'true');
  const k = Math.min(200 / D.width, 200 / D.height);
  D.pages.forEach((p, pi) => {
    const b = document.createElement('button'); b.className = pi === cur ? 'cur' : ''; b.setAttribute('aria-label', `Buka halaman ${pi + 1}`);
    const c = document.createElement('canvas'); renderPageTo(c, p, k); b.appendChild(c); b.insertAdjacentHTML('beforeend', `<span>${pi + 1}${p.title ? ' · ' + esc(p.title) : ''}</span>`);
    b.onclick = () => { closeGrid(); stopEdit(); cur = pi; sel = []; render(); $$('.pagebox')[pi]?.scrollIntoView({block: 'start', behavior: 'auto'}); };
    gg.appendChild(b);
  });
  const a = document.createElement('button'); a.className = 'addpage'; a.innerHTML = `${icon('plus')} Tambah halaman`; a.onclick = () => { pageAction('add', D.pages.length - 1); openGrid(); }; gg.appendChild(a);
  gg.querySelector('.cur')?.focus();
}
function closeGrid() { $('#gridv').hidden = true; $('#pgBtn').setAttribute('aria-pressed', 'false'); }
$('#pgBtn').onclick = () => $('#gridv').hidden ? openGrid() : closeGrid();
$('#gridX').onclick = closeGrid;

// ---------- presentation ----------
let presenting = false, slideTok = 0;
async function showSlide(dir = 0) {
  const tok = ++slideTok, ov = $('#present'), k = Math.min(2, Math.max(.2, Math.min(screen.width / D.width, screen.height / D.height) * (devicePixelRatio || 1)));
  const st = await buildStage(D.pages[cur], k); if (tok !== slideTok || !presenting) return;
  ov.querySelectorAll('.stage').forEach(x => x.remove()); ov.prepend(st); ov.querySelector('.pc').textContent = `${cur + 1} / ${D.pages.length} · ← → untuk pindah · Esc untuk keluar`;
  playTransition(st, D.pages[cur].trans, dir); playStage(st, D.pages[cur]);
}
async function present() {
  stopEdit(); closePop(); presenting = true; const ov = $('#present'); ov.hidden = false; showSlide();
  try { if (!ov.requestFullscreen) throw new Error('unsupported'); await ov.requestFullscreen(); }
  catch { Studio.toast('Layar penuh tidak diizinkan di sini, presentasi tampil di jendela. Tekan Esc untuk keluar.', 4000); }
}
function endPresent() { if (!presenting) return; presenting = false; $('#present').hidden = true; if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); render(); }
function slide(d) { const n = Math.max(0, Math.min(D.pages.length - 1, cur + d)); if (n !== cur) { cur = n; sel = []; showSlide(d); } }
$('#presentBtn').onclick = present;
$('#present').onclick = ev => slide(ev.clientX < innerWidth / 3 ? -1 : 1);
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && presenting) endPresent(); });
addEventListener('keydown', ev => {
  if (presenting) {
    ev.preventDefault(); ev.stopImmediatePropagation();
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(ev.key)) slide(1);
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(ev.key)) slide(-1);
    else if (ev.key === 'Escape') endPresent();
    return;
  }
  if (ev.key !== 'Escape') return;
  const open = !$('#pop').hidden ? closePop : !$('#share').hidden ? closeShare : !$('#gridv').hidden ? closeGrid : !$('#notes').hidden ? () => $('#notesBtn').click() : null;
  if (open) { ev.preventDefault(); ev.stopImmediatePropagation(); open(); }
}, true);
addEventListener('pointerdown', ev => {
  const p = $('#pop'); if (!p.hidden && !ev.target.closest('#pop') && !(p.dataset.for && ev.target.closest('#' + p.dataset.for))) closePop();
  if (!$('#share').hidden && !ev.target.closest('#share, #shareBtn')) closeShare();
}, true);
addEventListener('resize', () => { closePop(); closeShare(); render(); });
</script>
<script src="design-features.js"></script>
