[project]
name = "creative-mcp"
version = "0.1.0"
description = "MCP server for Canva (Connect API), CapCut (local drafts) and live desktop control"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.2", "httpx>=0.27"]

[project.optional-dependencies]
desktop = ["pyautogui>=0.9.54", "pillow>=10"]

[project.scripts]
creative-mcp = "creative_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creative_mcp"]
