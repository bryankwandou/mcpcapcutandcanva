<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Editor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Poppins:wght@400;700&family=Playfair+Display:wght@400;700&family=Bebas+Neue&family=Pacifico&family=Roboto:wght@400;700&display=swap">
<style>
:root{--bg:#0f1115;--panel:#171a21;--card:#1d212a;--line:#2a2f3a;--text:#e6e8ee;--muted:#8b93a7;--acc:#7c5cff;--acc2:#00c4cc}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:grid;grid-template-rows:52px 1fr;grid-template-columns:64px 260px 1fr 250px;grid-template-areas:"top top top top" "rail side work props";background:var(--bg);color:var(--text);font:13px/1.4 Montserrat,system-ui,sans-serif;overflow:hidden}
header{grid-area:top;display:flex;align-items:center;gap:8px;padding:0 12px;background:linear-gradient(90deg,#5b3df5,#00a3b4)}
header a{color:#fff;text-decoration:none;font-weight:700}header .sp{flex:1}
header input{background:#ffffff22;border:1px solid transparent;color:#fff;border-radius:6px;padding:6px 10px;font:inherit;width:240px}
header input:hover{border-color:#fff6}
button,select,input[type=number],input[type=text]{background:#262b36;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:6px 10px;font:inherit}
header button{background:#ffffff22;border:0;color:#fff}header button.pri{background:#fff;color:#4b2fd9;font-weight:700}
button{cursor:pointer}button:hover{filter:brightness(1.15)}
#rail{grid-area:rail;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:4px}
#rail button{width:54px;height:54px;border:0;background:none;border-radius:8px;font-size:10px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#rail button span{font-size:19px}#rail button.on{background:var(--card);color:var(--text)}
#side{grid-area:side;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:12px}
#side h4{margin:12px 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{aspect-ratio:1;border-radius:8px;background:var(--card);display:flex;align-items:center;justify-content:center;cursor:grab;border:1px solid var(--line);overflow:hidden;font-size:11px;text-align:center}
.tile img{width:100%;height:100%;object-fit:cover}
.txtbtn{display:block;width:100%;text-align:left;margin-bottom:6px;background:var(--card);cursor:grab}
#work{grid-area:work;overflow:auto;position:relative;background:#1a1d24}
#pages{display:flex;flex-direction:column;align-items:center;gap:26px;padding:30px 0 120px}
.pagewrap{position:relative}.pagebar{display:flex;gap:6px;justify-content:space-between;color:var(--muted);margin-bottom:6px;font-size:12px}
.pagebar button{padding:2px 7px;font-size:12px}
.page{position:relative;overflow:hidden;box-shadow:0 4px 24px #0008;transform-origin:0 0}
.el{position:absolute;transform-origin:center;user-select:none}
.el.text{white-space:pre-wrap;word-break:break-word;line-height:1.15;cursor:move}
.el.rect,.el.ellipse,.el.image{cursor:move}.el.image img{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block}
.el.line{cursor:move}
.el.sel{outline:2px solid var(--acc2)}
.el[contenteditable=true]{cursor:text;outline:2px dashed var(--acc2)}
.hd{position:absolute;width:16px;height:16px;background:#fff;border:2px solid var(--acc2);border-radius:50%;z-index:2}
.hd.se{right:-9px;bottom:-9px;cursor:nwse-resize}.hd.e{right:-9px;top:50%;margin-top:-8px;cursor:ew-resize;border-radius:4px}
.hd.s{bottom:-9px;left:50%;margin-left:-8px;cursor:ns-resize;border-radius:4px}.hd.rot{top:-40px;left:50%;margin-left:-8px;cursor:grab}
.guide{position:absolute;background:#ff3cac;z-index:3;pointer-events:none}
#props{grid-area:props;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:12px}
#props h4{margin:4px 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}.row label{font-size:11px;color:var(--muted);display:block}
.row input,.row select{width:100%}
.layer{display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:6px;cursor:pointer;margin-bottom:3px;background:var(--card)}
.layer.sel{outline:1px solid var(--acc2)}.layer span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer button{padding:0 5px;font-size:11px}
.sw{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.sw i{aspect-ratio:1;border-radius:50%;cursor:pointer;border:1px solid #fff3}
#zoomBox{position:fixed;right:262px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px;display:flex;gap:6px;align-items:center;z-index:5}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:8px;display:none;z-index:9}
@media (max-width:900px){body{grid-template-columns:56px 1fr;grid-template-rows:52px 1fr 220px;grid-template-areas:"top top" "rail work" "side props"}#zoomBox{right:12px}}
</style>
</head>
<body>
<header>
  <a id="back" href="index.html">← Beranda</a>
  <input id="title">
  <button id="undo" title="Ctrl+Z">↶</button><button id="redo" title="Ctrl+Y">↷</button>
  <span id="saved" style="color:#fffc;font-size:12px"></span>
  <span class="sp"></span>
  <select id="palette" title="Ganti palet"></select>
  <button id="exportPng">⬇ PNG</button>
  <button id="toCanva" class="pri">Kirim ke Canva</button>
</header>
<div id="rail">
  <button data-p="tpl" class="on"><span>🧩</span>Template</button>
  <button data-p="el"><span>🔷</span>Elemen</button>
  <button data-p="txt"><span>🔤</span>Teks</button>
  <button data-p="up"><span>☁️</span>Upload</button>
  <button data-p="bg"><span>🎨</span>Latar</button>
</div>
<aside id="side"></aside>
<div id="work"><div id="pages"></div></div>
<aside id="props"></aside>
<div id="zoomBox"><button id="zout">−</button><span id="zv">100%</span><button id="zin">+</button><button id="zfit">Fit</button></div>
<div id="toast"></div>
<input type="file" id="file" accept="image/*" multiple hidden>
<script src="studio.js"></script>
<script>
const $ = s => document.querySelector(s);
const FONTS = ['Montserrat', 'Poppins', 'Roboto', 'Playfair Display', 'Bebas Neue', 'Pacifico'];
const COLORS = ['#000000', '#FFFFFF', '#FF3B30', '#FF8A3D', '#FFD400', '#1FBF75', '#00C4CC', '#3A6DF0', '#7C5CFF', '#F27BA6', '#8C6A43', '#2B2420', '#E8F7F0', '#F6F1EA', '#0B0B1E', '#111111'];
let D, sel = null, cur = 0, zoom = 0.5, editing = null;
const undo = [], redo = [];
const id = hp.get('id');
const toast = m => { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 2500); };

async function boot() {
  await Studio.connect();
  $('#back').href = Studio.link('index.html');
  D = id && await Studio.getDesign(id);
  if (!D) { D = makeDesign('instagram_post'); await Studio.saveDesign(D); }
  $('#title').value = D.title;
  $('#palette').innerHTML = '<option value="">Palet…</option>' + Object.keys(PALETTES).map(p => `<option>${p}</option>`).join('');
  fit(); panel('tpl'); render();
}
// ---------- history & saving ----------
let before = null;
const snap = () => { before = JSON.stringify(D); };
function commit() {
  if (before && before !== JSON.stringify(D)) { undo.push(before); redo.length = 0; }
  before = null; render(); save();
}
let st;
function save() {
  $('#saved').textContent = 'Menyimpan…'; clearTimeout(st);
  st = setTimeout(async () => { D.thumb = await renderPage(D.pages[0], 240 / D.width).catch(() => D.thumb); await Studio.saveDesign(D); $('#saved').textContent = 'Tersimpan ✓'; }, 500);
}
$('#undo').onclick = () => { if (undo.length) { redo.push(JSON.stringify(D)); D = JSON.parse(undo.pop()); sel = null; render(); save(); } };
$('#redo').onclick = () => { if (redo.length) { undo.push(JSON.stringify(D)); D = JSON.parse(redo.pop()); sel = null; render(); save(); } };
$('#title').onchange = () => { snap(); D.title = $('#title').value; commit(); };

// ---------- helpers ----------
const page = () => D.pages[cur];
const findEl = i => { for (const [pi, p] of D.pages.entries()) { const e = p.elements.find(x => x.id === i); if (e) return [e, p, pi]; } return []; };
const imgSrc = s => s && s.startsWith('path:') ? Studio.mediaUrl(s.slice(5)) : s;
function fit() { const w = $('#work').clientWidth - 80, h = $('#work').clientHeight - 120; zoom = Math.min(w / D.width, h / D.height, 1); }
$('#zin').onclick = () => { zoom = Math.min(3, zoom * 1.2); render(); };
$('#zout').onclick = () => { zoom = Math.max(0.05, zoom / 1.2); render(); };
$('#zfit').onclick = () => { fit(); render(); };

// ---------- render pages ----------
function render() {
  $('#zv').textContent = Math.round(zoom * 100) + '%';
  const wrap = $('#pages'); wrap.innerHTML = '';
  D.pages.forEach((p, pi) => {
    const pw = document.createElement('div'); pw.className = 'pagewrap';
    pw.innerHTML = `<div class="pagebar"><span>Halaman ${pi + 1}${pi === cur ? ' •' : ''}</span><span>
      <button data-a="up">↑</button><button data-a="down">↓</button><button data-a="dup">⧉</button><button data-a="del">🗑</button><button data-a="add">＋</button></span></div>`;
    pw.querySelectorAll('.pagebar button').forEach(b => b.onclick = () => pageAction(b.dataset.a, pi));
    const box = document.createElement('div'); box.style.width = D.width * zoom + 'px'; box.style.height = D.height * zoom + 'px';
    const pg = document.createElement('div'); pg.className = 'page'; pg.dataset.pi = pi;
    Object.assign(pg.style, {width: D.width + 'px', height: D.height + 'px', background: p.bg, transform: `scale(${zoom})`});
    for (const e of p.elements) pg.appendChild(elNode(e, pi));
    pg.onpointerdown = ev => { if (ev.target === pg) { cur = pi; sel = null; stopEdit(); render(); } };
    pg.ondragover = ev => ev.preventDefault(); pg.ondrop = ev => dropOnPage(ev, pi, pg);
    box.appendChild(pg); pw.appendChild(box); wrap.appendChild(pw);
  });
  renderProps();
}
function elNode(e, pi) {
  const n = document.createElement('div'); n.className = `el ${e.type}${sel === e.id ? ' sel' : ''}`; n.dataset.id = e.id;
  Object.assign(n.style, {left: e.x + 'px', top: e.y + 'px', width: e.w + 'px', height: e.h + 'px', transform: `rotate(${e.rot || 0}deg)`, opacity: e.opacity ?? 1});
  if (e.type === 'text') Object.assign(n.style, {fontFamily: e.font, fontSize: e.fontSize + 'px', color: e.color, fontWeight: e.bold ? 700 : 400, fontStyle: e.italic ? 'italic' : 'normal', textAlign: e.align, letterSpacing: (e.spacing || 0) + 'px', height: 'auto', minHeight: e.h + 'px'}), n.textContent = e.text;
  if (e.type === 'rect') Object.assign(n.style, {background: e.fill, borderRadius: (e.radius || 0) + 'px', border: e.stroke ? `${e.strokeW || 4}px solid ${e.stroke}` : ''});
  if (e.type === 'ellipse') Object.assign(n.style, {background: e.fill, borderRadius: '50%', border: e.stroke ? `${e.strokeW || 4}px solid ${e.stroke}` : ''});
  if (e.type === 'line') Object.assign(n.style, {background: e.fill, height: Math.max(2, e.h) + 'px'});
  if (e.type === 'image') { const im = document.createElement('img'); im.src = imgSrc(e.src); im.crossOrigin = 'anonymous'; im.style.borderRadius = (e.radius || 0) + 'px'; n.appendChild(im); }
  if (sel === e.id && editing !== e.id) for (const h of ['se', 'e', 's', 'rot']) { const d = document.createElement('div'); d.className = 'hd ' + h; d.dataset.h = h; d.style.transform = `scale(${1 / zoom})`; n.appendChild(d); }
  n.onpointerdown = ev => { if (editing === e.id) return; startDrag(ev, e, pi); };
  return n;
}
function pageAction(a, pi) {
  snap();
  if (a === 'add') D.pages.splice(pi + 1, 0, {id: uid(), bg: D.pages[pi].bg, elements: []}), cur = pi + 1;
  if (a === 'dup') { const c = JSON.parse(JSON.stringify(D.pages[pi])); c.id = uid(); c.elements.forEach(e => e.id = uid()); D.pages.splice(pi + 1, 0, c); cur = pi + 1; }
  if (a === 'del' && D.pages.length > 1) D.pages.splice(pi, 1), cur = Math.max(0, pi - 1);
  if (a === 'up' && pi > 0) [D.pages[pi - 1], D.pages[pi]] = [D.pages[pi], D.pages[pi - 1]];
  if (a === 'down' && pi < D.pages.length - 1) [D.pages[pi + 1], D.pages[pi]] = [D.pages[pi], D.pages[pi + 1]];
  commit();
}
// ---------- drag / resize / rotate with snapping ----------
let lastDown = {};
function startDrag(ev, e, pi) {
  ev.preventDefault(); ev.stopPropagation(); stopEdit();
  const now = Date.now(), dbl = lastDown.id === e.id && now - lastDown.t < 400; lastDown = {id: e.id, t: now};
  if (dbl && !ev.target.dataset.h) {   // own double-click detection: nodes are re-rendered between clicks   // double click: edit text / replace photo
    if (e.type === 'text') return startEdit(document.querySelector(`.page[data-pi="${pi}"] [data-id="${e.id}"]`), e);
    if (e.type === 'image' || e.name?.includes('Foto')) return $('#file').click();
  }
  if (sel !== e.id || cur !== pi) { sel = e.id; cur = pi; render(); }
  snap();
  const mode = ev.target.dataset.h || 'move', sx = ev.clientX, sy = ev.clientY, o = {...e};
  const pg = document.querySelector(`.page[data-pi="${pi}"]`), node = pg.querySelector(`[data-id="${e.id}"]`);
  const r = node.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const move = m => {
    const dx = (m.clientX - sx) / zoom, dy = (m.clientY - sy) / zoom;
    pg.querySelectorAll('.guide').forEach(g => g.remove());
    if (mode === 'move') {
      e.x = Math.round(o.x + dx); e.y = Math.round(o.y + dy);
      const T = 8 / zoom, mx = e.x + e.w / 2, my = e.y + e.h / 2;   // snap to page centre & edges
      if (Math.abs(mx - D.width / 2) < T) { e.x = Math.round(D.width / 2 - e.w / 2); guide(pg, 'v', D.width / 2); }
      if (Math.abs(my - D.height / 2) < T) { e.y = Math.round(D.height / 2 - e.h / 2); guide(pg, 'h', D.height / 2); }
      if (Math.abs(e.x) < T) e.x = 0; if (Math.abs(e.y) < T) e.y = 0;
      if (Math.abs(e.x + e.w - D.width) < T) e.x = D.width - e.w; if (Math.abs(e.y + e.h - D.height) < T) e.y = D.height - e.h;
    } else if (mode === 'se') {
      const k = Math.max(0.05, (o.w + dx) / o.w);
      if (m.shiftKey || e.type === 'rect' || e.type === 'ellipse' || e.type === 'line') { e.w = Math.max(10, Math.round(o.w + dx)); e.h = Math.max(2, Math.round(o.h + dy)); }
      else { e.w = Math.round(o.w * k); e.h = Math.round(o.h * k); if (e.type === 'text') e.fontSize = Math.max(6, Math.round(o.fontSize * k)); }
    } else if (mode === 'e') e.w = Math.max(10, Math.round(o.w + dx));
    else if (mode === 's') e.h = Math.max(2, Math.round(o.h + dy));
    else { let a = Math.atan2(m.clientX - cx, cy - m.clientY) * 180 / Math.PI; if (!m.shiftKey) for (const s of [0, 45, 90, 135, 180, -45, -90, -135, -180]) if (Math.abs(a - s) < 4) a = s; e.rot = Math.round(a); }
    Object.assign(node.style, {left: e.x + 'px', top: e.y + 'px', width: e.w + 'px', transform: `rotate(${e.rot || 0}deg)`});
    if (e.type === 'text') { node.style.fontSize = e.fontSize + 'px'; node.style.minHeight = e.h + 'px'; } else node.style.height = e.h + 'px';
    renderProps();
  };
  const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); pg.querySelectorAll('.guide').forEach(g => g.remove()); if (before !== JSON.stringify(D)) commit(); else before = null; };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
}
function guide(pg, dir, pos) {
  const g = document.createElement('div'); g.className = 'guide';
  Object.assign(g.style, dir === 'v' ? {left: pos + 'px', top: 0, width: 2 / zoom + 'px', height: '100%'} : {top: pos + 'px', left: 0, height: 2 / zoom + 'px', width: '100%'});
  pg.appendChild(g);
}
function startEdit(n, e) {
  editing = e.id; snap(); n.querySelectorAll('.hd').forEach(h => h.remove());
  n.contentEditable = 'true'; n.classList.remove('sel'); n.focus(); document.getSelection().selectAllChildren(n);
  n.oninput = () => { e.text = n.innerText; };
  n.onblur = () => stopEdit();
}
function stopEdit() { if (!editing) return; editing = null; commit(); }

// ---------- add elements ----------
function add(e, pi = cur) {
  snap(); e.id = uid(); e.rot ??= 0; e.opacity ??= 1;
  if (e.x == null) { e.x = Math.round((D.width - e.w) / 2); e.y = Math.round((D.height - e.h) / 2); }
  D.pages[pi].elements.push(e); sel = e.id; cur = pi; commit();
}
const presets = {
  heading: () => ({type: 'text', text: 'Tambahkan judul', w: D.width * 0.7, h: D.width * 0.09, fontSize: Math.round(D.width * 0.07), color: '#111111', bold: true, align: 'center', font: 'Montserrat'}),
  sub: () => ({type: 'text', text: 'Tambahkan subjudul', w: D.width * 0.6, h: D.width * 0.06, fontSize: Math.round(D.width * 0.04), color: '#333333', bold: true, align: 'center', font: 'Poppins'}),
  body: () => ({type: 'text', text: 'Tambahkan sedikit teks isi', w: D.width * 0.5, h: D.width * 0.04, fontSize: Math.round(D.width * 0.025), color: '#333333', align: 'center', font: 'Roboto'}),
  rect: () => ({type: 'rect', w: D.width * 0.3, h: D.width * 0.3, fill: '#7C5CFF', radius: 0}),
  round: () => ({type: 'rect', w: D.width * 0.35, h: D.width * 0.18, fill: '#00C4CC', radius: 40}),
  ellipse: () => ({type: 'ellipse', w: D.width * 0.3, h: D.width * 0.3, fill: '#FF8A3D'}),
  line: () => ({type: 'line', w: D.width * 0.5, h: 8, fill: '#111111'}),
  frame: () => ({type: 'rect', w: D.width * 0.4, h: D.width * 0.4, fill: 'transparent', stroke: '#111111', strokeW: 8, radius: 0}),
  badge: () => ({type: 'ellipse', w: D.width * 0.22, h: D.width * 0.22, fill: '#FF3B30', stroke: '#FFFFFF', strokeW: 10}),
};
function dropOnPage(ev, pi, pg) {
  ev.preventDefault();
  const data = JSON.parse(ev.dataTransfer.getData('text/plain') || '{}'), r = pg.getBoundingClientRect();
  const px = (ev.clientX - r.left) / zoom, py = (ev.clientY - r.top) / zoom;
  let e = data.preset ? presets[data.preset]() : data.src ? {type: 'image', src: data.src, w: D.width * 0.4, h: D.width * 0.4 / (data.ar || 1)} : null;
  if (!e) return;
  if (e.type === 'image') {  // dropping a photo onto a placeholder/rect fills it, like a frame
    const target = [...D.pages[pi].elements].reverse().find(x => (x.type === 'rect' || x.type === 'image') && px >= x.x && px <= x.x + x.w && py >= x.y && py <= x.y + x.h);
    if (target) { snap(); Object.assign(target, {type: 'image', src: data.src, name: undefined}); sel = target.id; cur = pi; return commit(); }
  }
  e.x = Math.round(px - e.w / 2); e.y = Math.round(py - e.h / 2); add(e, pi);
}
// ---------- side panels ----------
let uploads = JSON.parse(ls('uploads') || '[]');
document.querySelectorAll('#rail button').forEach(b => b.onclick = () => panel(b.dataset.p));
function tile(html, data, onclick) {
  const t = document.createElement('div'); t.className = 'tile'; t.innerHTML = html; t.draggable = true;
  t.ondragstart = ev => ev.dataTransfer.setData('text/plain', JSON.stringify(data)); t.onclick = onclick; return t;
}
async function panel(p) {
  document.querySelectorAll('#rail button').forEach(b => b.classList.toggle('on', b.dataset.p === p));
  const s = $('#side'); s.innerHTML = '';
  if (p === 'tpl') {
    s.innerHTML = '<h4>Template untuk ukuran ini</h4><div class="tiles" id="tt"></div><p style="color:var(--muted)">Klik untuk mengganti halaman aktif dengan template (bisa di-undo).</p>';
    for (const [pn, pal] of Object.entries(PALETTES)) $('#tt').appendChild(tile(`<div style="width:100%;height:100%;background:${pal.bg};display:flex;align-items:center;justify-content:center;gap:4px"><i style="width:35%;height:45%;background:${pal.primary};display:block"></i><b style="color:${pal.text}">${pn}</b></div>`, {}, () => {
      snap(); const t = makeDesign(D.kind || 'square', pn); const W = t.width, H = t.height, kx = D.width / W, ky = D.height / H;
      t.pages.forEach(pg => pg.elements.forEach(e => { e.x *= kx; e.y *= ky; e.w *= kx; e.h *= ky; if (e.fontSize) e.fontSize = Math.round(e.fontSize * Math.min(kx, ky)); }));
      D.pages.splice(cur, 1, ...t.pages); commit();
    }));
  } else if (p === 'el') {
    s.innerHTML = '<h4>Bentuk</h4><div class="tiles" id="sh"></div><h4>Warna cepat</h4><div class="sw" id="qc"></div>';
    const prev = {rect: '<i style="width:60%;height:60%;background:#7C5CFF"></i>', round: '<i style="width:70%;height:40%;background:#00C4CC;border-radius:10px"></i>',
      ellipse: '<i style="width:60%;height:60%;background:#FF8A3D;border-radius:50%"></i>', line: '<i style="width:70%;height:4px;background:#ddd"></i>',

    else (await Studio.api('/api/library')).filter(i => i.type === 'photo').slice(0, 120).forEach(i => {
      const src = 'path:' + i.path; $('#pc').appendChild(tile(`<img loading="lazy" src="${Studio.mediaUrl(i.path)}">`, {src, ar: 1}, () => add({type: 'image', src, w: D.width * 0.4, h: D.width * 0.4})));

    COLORS.forEach(c => { const i = document.createElement('i'); i.style.background = c; i.onclick = () => { snap(); page().bg = c; commit(); }; $('#bgc').appendChild(i); });

$('#file').onchange = async ev => {
  for (const f of ev.target.files) {
    const src = await shrink(f), ar = await new Promise(r => { const i = new Image(); i.onload = () => r(i.width / i.height); i.src = src; });
    uploads.unshift({src, ar}); uploads = uploads.slice(0, 30); lsSet('uploads', JSON.stringify(uploads));
    const [e] = findEl(sel);
    if (e && (e.type === 'image' || e.name?.includes('Foto'))) { snap(); Object.assign(e, {type: 'image', src, name: undefined}); commit(); }

  }

async function shrink(file, max = 2000) {  // keep designs light: downscale big photos
  const bmp = await createImageBitmap(file), k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = bmp.width * k; c.height = bmp.height * k; c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.88);
}
// ---------- properties & layers ----------
function setProp(k, v) { const [e] = findEl(sel); if (!e) return; snap(); if (k === 'color' && e.type !== 'text') k = 'fill'; e[k] = v; commit(); }
function renderProps() {
  const P = $('#props'), [e, p] = findEl(sel);
  if (P.contains(document.activeElement) && P.dataset.id === sel) { P.querySelectorAll('[data-k]').forEach(i => { if (i !== document.activeElement && e) i.value = e[i.dataset.k] ?? ''; }); return; }
  P.dataset.id = sel || ''; let h = '';
  if (e) {
    const num = (k, l) => `<div><label>${l}</label><input type="number" data-k="${k}" value="${Math.round(e[k] ?? 0)}"></div>`;
    h += `<h4>${e.type === 'text' ? 'Teks' : e.type === 'image' ? 'Gambar' : 'Bentuk'}</h4><div class="row">${num('x', 'X')}${num('y', 'Y')}${num('w', 'Lebar')}${num('h', 'Tinggi')}${num('rot', 'Rotasi')}<div><label>Opacity</label><input type="number" step="0.1" min="0" max="1" data-k="opacity" value="${e.opacity ?? 1}"></div></div>`;
    if (e.type === 'text') h += `<div class="row"><div><label>Font</label><select data-k="font">${FONTS.map(f => `<option ${f === e.font ? 'selected' : ''}>${f}</option>`).join('')}</select></div>${num('fontSize', 'Ukuran')}
      <div><label>Warna</label><input type="color" data-k="color" value="${e.color}"></div><div><label>Rata</label><select data-k="align">${['left', 'center', 'right'].map(a => `<option ${a === e.align ? 'selected' : ''}>${a}</option>`).join('')}</select></div>
      ${num('spacing', 'Spasi huruf')}<div><label>Gaya</label><button id="bBold" style="font-weight:700">B</button> <button id="bIt" style="font-style:italic">I</button></div></div>`;
    if (e.type === 'rect' || e.type === 'ellipse' || e.type === 'line') h += `<div class="row"><div><label>Isi</label><input type="color" data-k="fill" value="${/^#/.test(e.fill) ? e.fill : '#ffffff'}"></div>${e.type === 'rect' ? num('radius', 'Sudut') : '<div></div>'}
      <div><label>Garis</label><input type="color" data-k="stroke" value="${e.stroke || '#000000'}"></div>${num('strokeW', 'Tebal garis')}</div>`;
    if (e.type === 'image') h += `<div class="row">${num('radius', 'Sudut')}<div><label>&nbsp;</label><button id="rep">Ganti foto</button></div></div>`;
    h += `<div class="row"><button id="dup">⧉ Duplikat</button><button id="del">🗑 Hapus</button><button id="fwd">⬆ Maju</button><button id="bwd">⬇ Mundur</button></div>`;
  } else h += `<h4>Halaman ${cur + 1}</h4><div class="row"><div><label>Latar</label><input type="color" id="pbg" value="${/^#/.test(page().bg) ? page().bg : '#ffffff'}"></div><div><label>Ukuran</label><div>${D.width}×${D.height}</div></div></div>`;
  h += `<h4 style="margin-top:16px">Layer</h4>`;
  [...page().elements].reverse().forEach(x => { h += `<div class="layer${x.id === sel ? ' sel' : ''}" data-l="${x.id}"><span>${{text: '🔤', rect: '▭', ellipse: '◯', line: '—', image: '🖼'}[x.type]} ${x.type === 'text' ? x.text.slice(0, 22) : x.name || x.type}</span></div>`; });
  P.innerHTML = h;
  P.querySelectorAll('[data-k]').forEach(i => {
    i.onfocus = snap;
    i.oninput = () => { const [el] = findEl(sel); el[i.dataset.k] = i.type === 'number' ? +i.value : i.value; const keep = document.activeElement; render(); keep?.focus?.(); };
    i.onchange = () => commit();
  });
  P.querySelectorAll('[data-l]').forEach(l => l.onclick = () => { sel = l.dataset.l; render(); });
  const b = (i, f) => { const x = P.querySelector('#' + i); if (x) x.onclick = f; };
  b('dup', duplicate); b('del', remove);
  b('fwd', () => reorder(1)); b('bwd', () => reorder(-1)); b('rep', () => $('#file').click());
  b('bBold', () => setProp('bold', !e.bold)); b('bIt', () => setProp('italic', !e.italic));

}
function duplicate() { const [e, p] = findEl(sel); if (!e) return; snap(); const c = {...JSON.parse(JSON.stringify(e)), id: uid(), x: e.x + 30, y: e.y + 30}; p.elements.push(c); sel = c.id; commit(); }
function remove() { const [e, p] = findEl(sel); if (!e) return; snap(); p.elements = p.elements.filter(x => x.id !== sel); D.pages = D.pages.map(x => x === p ? {...p} : x); sel = null; commit(); }
function reorder(d) { const [e, p] = findEl(sel); if (!e) return; snap(); const a = p.elements, i = a.indexOf(e), j = Math.max(0, Math.min(a.length - 1, i + d)); a.splice(i, 1); a.splice(j, 0, e); commit(); }
let clip = null;
document.addEventListener('keydown', ev => {
  if (editing || ev.target.matches('input,select,textarea')) return;
  const c = ev.ctrlKey || ev.metaKey, [e] = findEl(sel);
  if (c && ev.key === 'z') { ev.preventDefault(); $('#undo').click(); }
  else if (c && ev.key === 'y') { ev.preventDefault(); $('#redo').click(); }
  else if (c && ev.key === 'd') { ev.preventDefault(); duplicate(); }
  else if (c && ev.key === 'c' && e) clip = JSON.stringify(e);
  else if (c && ev.key === 'v' && clip) { const x = JSON.parse(clip); x.x += 30; x.y += 30; delete x.id; add(x); }
  else if ((ev.key === 'Delete' || ev.key === 'Backspace') && e) remove();
  else if (e && ev.key.startsWith('Arrow')) { ev.preventDefault(); snap(); const s = ev.shiftKey ? 10 : 1; if (ev.key === 'ArrowLeft') e.x -= s; if (ev.key === 'ArrowRight') e.x += s; if (ev.key === 'ArrowUp') e.y -= s; if (ev.key === 'ArrowDown') e.y += s; commit(); }
  else if (ev.key === 'Escape') { sel = null; render(); }
});
$('#palette').onchange = ev => {   // recolor the whole design with another palette
  const to = PALETTES[ev.target.value], from = PALETTES[D.palette] || PALETTES.bold; if (!to) return;
  snap(); const map = Object.fromEntries(Object.keys(from).map(k => [from[k].toUpperCase(), to[k]]));
  for (const p of D.pages) { p.bg = map[p.bg?.toUpperCase()] || p.bg; for (const e of p.elements) for (const k of ['fill', 'color', 'stroke']) if (e[k] && map[e[k].toUpperCase()]) e[k] = map[e[k].toUpperCase()]; }
  D.palette = ev.target.value; ev.target.value = ''; commit();
};
// ---------- export ----------
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => res(i); i.onerror = rej; i.src = src; });
async function renderPage(p, k = 1) {
  await document.fonts.ready;
  const c = document.createElement('canvas'); c.width = D.width * k; c.height = D.height * k;
  const x = c.getContext('2d'); x.scale(k, k); x.fillStyle = p.bg; x.fillRect(0, 0, D.width, D.height);
  for (const e of p.elements) {
    x.save(); x.globalAlpha = e.opacity ?? 1; x.translate(e.x + e.w / 2, e.y + e.h / 2); x.rotate((e.rot || 0) * Math.PI / 180); x.translate(-e.w / 2, -e.h / 2);
    const path = () => { x.beginPath(); if (e.type === 'ellipse') x.ellipse(e.w / 2, e.h / 2, e.w / 2, e.h / 2, 0, 0, 7); else x.roundRect(0, 0, e.w, e.h, Math.min(e.radius || 0, e.w / 2, e.h / 2)); };
    if (e.type === 'rect' || e.type === 'ellipse' || e.type === 'line') {
      path(); if (e.fill && e.fill !== 'transparent') { x.fillStyle = e.fill; x.fill(); }
      if (e.stroke) { x.lineWidth = e.strokeW || 4; x.strokeStyle = e.stroke; x.stroke(); }
    } else if (e.type === 'image') {
      try { const im = await loadImg(imgSrc(e.src)), s = Math.max(e.w / im.width, e.h / im.height), iw = im.width * s, ih = im.height * s;
        path(); x.clip(); x.drawImage(im, (e.w - iw) / 2, (e.h - ih) / 2, iw, ih); } catch {}
    } else if (e.type === 'text') {
      x.font = `${e.italic ? 'italic ' : ''}${e.bold ? 700 : 400} ${e.fontSize}px "${e.font}"`; x.fillStyle = e.color; x.textBaseline = 'top';
      if (x.letterSpacing !== undefined) x.letterSpacing = (e.spacing || 0) + 'px';
      const lines = []; for (const para of e.text.split('\n')) { let line = ''; for (const w of para.split(' ')) { const t = line ? line + ' ' + w : w; if (x.measureText(t).width > e.w && line) { lines.push(line); line = w; } else line = t; } lines.push(line); }
      lines.forEach((l, i) => { const lw = x.measureText(l).width, lx = e.align === 'center' ? (e.w - lw) / 2 : e.align === 'right' ? e.w - lw : 0; x.fillText(l, lx, i * e.fontSize * 1.15); });
    }
    x.restore();
  }
  return c.toDataURL('image/png');
}
$('#exportPng').onclick = async () => {
  for (const [i, p] of D.pages.entries()) { const a = document.createElement('a'); a.href = await renderPage(p); a.download = `${D.title}-${i + 1}.png`; a.click(); }
  toast('PNG diunduh');
};
$('#toCanva').onclick = async () => {

  } catch (err) { toast('Gagal: ' + err.message); }
