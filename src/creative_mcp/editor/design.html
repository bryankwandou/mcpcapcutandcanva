<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rakit Desain</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:wght@400;600&family=Montserrat:ital,wght@0,400;0,700;1,400&family=Poppins:wght@400;700&family=Roboto:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:wght@400;700&family=Oswald:wght@400;700&family=Bebas+Neue&family=Pacifico&family=Dancing+Script:wght@400;700&family=Archivo+Black&family=DM+Serif+Display&display=swap">
<link rel="stylesheet" href="studio.css">
<style>
body { display: grid; height: 100%; overflow: hidden;
  grid-template-columns: 72px 300px minmax(0, 1fr); grid-template-rows: 52px 46px minmax(0, 1fr) 40px;
  grid-template-areas: "top top top" "rail side tool" "rail side work" "rail side foot"; }
header { grid-area: top; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--surface); border-bottom: 1px solid var(--line); min-width: 0; }
header .title { flex: 1; display: flex; justify-content: center; min-width: 0; }
header .title input { background: transparent; border-color: transparent; text-align: center; font-weight: 600; width: min(340px, 100%); }
header .title input:hover, header .title input:focus { border-color: var(--line); background: var(--surface-2); }
#saved { color: var(--muted); font-size: 12px; white-space: nowrap; }
#rail { grid-area: rail; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 2px; overflow: auto; }
#rail button { width: 62px; padding: 8px 0 6px; background: none; border: 0; border-radius: 8px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10.5px; }
#rail button:hover { color: var(--fg); background: var(--surface-2); }
#rail button.on { color: var(--fg); background: var(--surface-2); box-shadow: inset 3px 0 0 var(--accent); }
#side { grid-area: side; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
#side .ph { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
#side .ph h3 { font-size: 15px; flex: 1; }
#sideBody { padding: 4px 14px 24px; overflow: auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-content: start; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tiles.two { grid-template-columns: repeat(2, 1fr); }
.tile { aspect-ratio: 1; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; cursor: grab; overflow: hidden; position: relative; padding: 0; color: var(--fg); font-size: 11px; text-align: center; }
.tile:hover { border-color: #505767; }
.tile img { width: 100%; height: 100%; object-fit: cover; }
.tile .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 5px; background: #000a; font-size: 10px; }
.addtext { display: block; width: 100%; text-align: left; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: grab; }
.swatches { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.swatches button { aspect-ratio: 1; border-radius: 50%; border: 1px solid #ffffff2a; padding: 0; }
.swatches button:hover { transform: scale(1.08); }
.field { display: grid; gap: 4px; }
.field > span { font-size: 11.5px; color: var(--muted); display: flex; justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.fxtile { aspect-ratio: 1.3; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 4px; font: 700 22px var(--f-display); color: #fff; }
.fxtile small { font: 400 10.5px var(--f-body); color: var(--muted); }
.fxtile.on { border-color: var(--select); }
.layer { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid transparent; cursor: pointer; }
.layer.sel { border-color: var(--select); }
.layer .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.layer button { background: none; border: 0; color: var(--muted); padding: 2px; }
#tool { grid-area: tool; display: flex; align-items: center; gap: 4px; padding: 0 10px; background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; min-width: 0; }
#tool .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; flex: none; }
#tool select { max-width: 170px; }
#tool input[type=number] { width: 58px; }
#tool .hint { color: var(--muted); }
#work { grid-area: work; overflow: auto; background: var(--well); position: relative; min-height: 0; }
#pages { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 26px 24px 80px; min-width: max-content; }
.pagehead { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px; margin-bottom: 6px; gap: 8px; }
.pagehead .row { gap: 2px; }
.pagehead .btn { padding: 3px; }
.page { position: relative; overflow: hidden; transform-origin: 0 0; box-shadow: 0 6px 30px #0009; }
.pagebox.cur .page { outline: 2px solid #ffffff22; }
.el { position: absolute; transform-origin: center; user-select: none; touch-action: none; }
.el.sel::after { content: ""; position: absolute; inset: 0; outline: calc(2px / var(--z)) solid var(--select); pointer-events: none; }
.el .in { width: 100%; height: 100%; }
.el.text { white-space: pre-wrap; overflow-wrap: break-word; cursor: move; }
.el.text[contenteditable=true] { cursor: text; outline: calc(2px / var(--z)) dashed var(--select); }
.el .imgbox { width: 100%; height: 100%; overflow: hidden; position: relative; }
.el .imgbox img { position: absolute; max-width: none; pointer-events: none; }
.hd { position: absolute; width: calc(14px / var(--z)); height: calc(14px / var(--z)); background: #fff; border: calc(2px / var(--z)) solid var(--select); border-radius: 50%; z-index: 3; }
.hd[data-h=nw] { left: calc(-7px / var(--z)); top: calc(-7px / var(--z)); cursor: nwse-resize; }
.hd[data-h=ne] { right: calc(-7px / var(--z)); top: calc(-7px / var(--z)); cursor: nesw-resize; }
.hd[data-h=sw] { left: calc(-7px / var(--z)); bottom: calc(-7px / var(--z)); cursor: nesw-resize; }
.hd[data-h=se] { right: calc(-7px / var(--z)); bottom: calc(-7px / var(--z)); cursor: nwse-resize; }
.hd[data-h=e] { right: calc(-7px / var(--z)); top: calc(50% - 7px / var(--z)); border-radius: 4px; cursor: ew-resize; }
.hd[data-h=w] { left: calc(-7px / var(--z)); top: calc(50% - 7px / var(--z)); border-radius: 4px; cursor: ew-resize; }
.hd[data-h=s] { bottom: calc(-7px / var(--z)); left: calc(50% - 7px / var(--z)); border-radius: 4px; cursor: ns-resize; }
.hd[data-h=n] { top: calc(-7px / var(--z)); left: calc(50% - 7px / var(--z)); border-radius: 4px; cursor: ns-resize; }
.hd[data-h=rot] { bottom: calc(-36px / var(--z)); left: calc(50% - 7px / var(--z)); cursor: grab; }
.lockbadge { position: absolute; right: 0; top: 0; transform: translate(50%, -50%) scale(calc(1 / var(--z))); background: var(--surface); border-radius: 50%; padding: 3px; color: var(--accent); display: flex; z-index: 3; }
.guide { position: absolute; background: #ff4fa0; z-index: 4; pointer-events: none; }
.marquee { position: absolute; border: calc(1px / var(--z)) solid var(--select); background: #46c2ff22; z-index: 5; pointer-events: none; }
#foot { grid-area: foot; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: var(--surface); border-top: 1px solid var(--line); }
#foot input[type=range] { width: 160px; }
.drop-hint { position: fixed; inset: 0; border: 3px dashed var(--accent); pointer-events: none; z-index: 40; display: none; }
@media (max-width: 820px) {
  body { grid-template-columns: minmax(0, 1fr); grid-template-rows: 52px 46px minmax(0, 1fr) 40px 62px;
    grid-template-areas: "top" "tool" "work" "foot" "rail"; }
  #rail { flex-direction: row; border-right: 0; border-top: 1px solid var(--line); padding: 4px 6px calc(4px + env(safe-area-inset-bottom, 0px)); }
  #rail button { width: 58px; flex: none; }
  #side { position: fixed; left: 0; right: 0; bottom: 62px; height: 46vh; z-index: 20; border-top: 1px solid var(--line); }
  #side.closed { display: none; }
  header .hide-sm { display: none; }
  #foot input[type=range] { width: 100px; }
  #pageInfo, #saved { display: none; }
}
@media (max-width: 560px) { header .lbl { display: none; } }
</style>
</head>
<body>
<header>
  <button class="btn ghost icon" id="home" title="Beranda"></button>
  <button class="btn ghost hide-sm" id="resizeBtn"></button>
  <button class="btn ghost icon" id="undo" title="Urungkan (Ctrl+Z)"></button>
  <button class="btn ghost icon" id="redo" title="Ulangi (Ctrl+Y)"></button>
  <span id="saved"></span>
  <div class="title"><input type="text" id="title" aria-label="Judul desain"></div>
  <button class="btn" id="exportBtn"></button>
  <button class="btn primary" id="canvaBtn"></button>
</header>
<nav id="rail" aria-label="Panel"></nav>
<aside id="side"><div class="ph"><h3 id="sideTitle"></h3><button class="btn ghost icon" id="sideClose" title="Tutup panel"></button></div><div id="sideBody"></div></aside>
<div id="tool" role="toolbar" aria-label="Alat elemen"></div>
<main id="work"><div id="pages"></div></main>
<footer id="foot">
  <span class="mono" id="pageInfo"></span><span class="grow"></span>
  <button class="btn ghost icon" id="zout" title="Perkecil"></button>
  <input type="range" id="zoom" min="5" max="300" value="50" aria-label="Zoom">
  <button class="btn ghost icon" id="zin" title="Perbesar"></button>
  <span class="mono" id="zv" style="width:44px;text-align:right"></span>
  <button class="btn" id="fit">Pas</button>
</footer>
<input type="file" id="file" accept="image/*" multiple hidden>
<input type="file" id="fontFile" accept=".ttf,.otf,.woff,.woff2" hidden>
<div class="drop-hint" id="dropHint"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="studio.js"></script>
<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const FONTS = ['Plus Jakarta Sans', 'Bricolage Grotesque', 'Montserrat', 'Poppins', 'Roboto', 'Oswald', 'Archivo Black', 'Bebas Neue', 'Playfair Display', 'DM Serif Display', 'Lora', 'Pacifico', 'Dancing Script', 'JetBrains Mono'];
const BASIC = ['#000000', '#FFFFFF', '#545454', '#D95D39', '#E8B02A', '#F2A541', '#2F8F5B', '#36C5B1', '#1F6FB2', '#2F5D8A', '#7A4A2A', '#B48CFF', '#F27BA6', '#2A1B3D'];
const GRADS = [['#FF8C5A', '#F4C95D'], ['#1F6FB2', '#36C5B1'], ['#2A1B3D', '#D95D39'], ['#E8B02A', '#D95D39'], ['#B48CFF', '#46C2FF'], ['#13301F', '#2F8F5B'], ['#F4EDE1', '#E8B02A'], ['#000000', '#545454']];
const FILTERS = {Normal: {}, Hangat: {sepia: 25, saturate: 120, brightness: 104}, Dingin: {hue: 190, saturate: 90, sepia: 10}, 'Hitam putih': {grayscale: 100, contrast: 110},
  Vintage: {sepia: 45, contrast: 90, brightness: 105, saturate: 80}, Pop: {saturate: 160, contrast: 115}, Pudar: {contrast: 80, brightness: 110, saturate: 70}, Drama: {contrast: 140, brightness: 90, saturate: 110}};
const ADJ0 = {brightness: 100, contrast: 100, saturate: 100, hue: 0, blur: 0, grayscale: 0, sepia: 0};
const POLY = {triangle: [[.5, 0], [1, 1], [0, 1]], star: Array.from({length: 10}, (_, i) => { const r = i % 2 ? .4 : 1, a = -Math.PI / 2 + i * Math.PI / 5; return [.5 + r * Math.cos(a) / 2, .5 + r * Math.sin(a) / 2]; })};
let D, sel = [], cur = 0, zoom = .5, editing = null, rail = 'tpl', ctx = null, clip = null;
const undoS = [], redoS = [];

// ---------- boot ----------
$('#home').innerHTML = icon('home'); $('#undo').innerHTML = icon('undo'); $('#redo').innerHTML = icon('redo'); $('#sideClose').innerHTML = icon('x');
$('#resizeBtn').innerHTML = `${icon('resize')} Ubah ukuran <span class="tier pro" title="Di Canva fitur ini khusus Pro">Pro di Canva</span>`;
$('#exportBtn').innerHTML = `${icon('download')}<span class="lbl"> Ekspor</span>`; $('#canvaBtn').innerHTML = `${icon('send')}<span class="lbl"> Kirim ke Canva</span>`;
$('#zout').innerHTML = icon('zoomOut'); $('#zin').innerHTML = icon('zoomIn');
const RAIL = [['tpl', 'layout', 'Template'], ['el', 'shapes', 'Elemen'], ['txt', 'text', 'Teks'], ['up', 'upload', 'Upload'], ['pc', 'image', 'Foto'], ['bg', 'fill', 'Latar'], ['brand', 'palette', 'Merek'], ['layers', 'layers', 'Layer']];
$('#rail').innerHTML = RAIL.map(([k, i, l]) => `<button data-r="${k}">${icon(i)}${l}</button>`).join('');
$$('#rail button').forEach(b => b.onclick = () => { ctx = null; openRail(b.dataset.r); });
$('#sideClose').onclick = () => { if (ctx) { ctx = null; openRail(rail); } else $('#side').classList.add('closed'); };

async function boot() {
  await Studio.connect();
  if (PARAMS.id) D = await Studio.getDesign(PARAMS.id).catch(() => null);
  if (!D) { const list = await Studio.listDesigns().catch(() => []); list.sort((a, b) => b.updated - a.updated); if (list[0]) D = await Studio.getDesign(list[0].id); }
  if (!D) { D = makeDesign('instagram_post'); await Studio.saveDesign(D).catch(() => {}); }
  migrate(); loadFonts();
  $('#title').value = D.title; fit(); openRail(innerWidth > 820 ? 'tpl' : rail); if (innerWidth <= 820) $('#side').classList.add('closed');
  render(); await document.fonts.ready; render();
}
function migrate() { D.fonts ??= []; D.pages.forEach(p => p.elements.forEach(e => { if (e.type === 'text') { e.font ||= 'Plus Jakarta Sans'; e.align ||= 'left'; } })); }
function loadFonts() { for (const f of D.fonts) new FontFace(f.name, `url(${f.src})`).load().then(ff => { document.fonts.add(ff); render(); }).catch(() => {}); }

// ---------- history & saving ----------
let before = null, saveT;
const snap = () => { if (before === null) before = JSON.stringify(D); };
function commit() {
  if (before !== null && before !== JSON.stringify(D)) { undoS.push(before); if (undoS.length > 100) undoS.shift(); redoS.length = 0; }
  before = null; render(); save();
}
function save() {
  $('#saved').textContent = 'Menyimpan…'; clearTimeout(saveT);
  saveT = setTimeout(async () => {
    try { D.thumb = (await renderPage(D.pages[0], 240 / D.width)).toDataURL('image/jpeg', .7); } catch {}
    try { await Studio.saveDesign(D); $('#saved').textContent = Studio.connected ? 'Tersimpan di komputer' : 'Tersimpan di browser'; }
    catch (err) { $('#saved').textContent = 'Gagal menyimpan'; Studio.toast(err.message, 5000); }
  }, 600);
}
const restore = json => { D = JSON.parse(json); sel = sel.filter(id => findEl(id)[0]); cur = Math.min(cur, D.pages.length - 1); render(); save(); };
$('#undo').onclick = () => { if (undoS.length) { redoS.push(JSON.stringify(D)); restore(undoS.pop()); } };
$('#redo').onclick = () => { if (redoS.length) { undoS.push(JSON.stringify(D)); restore(redoS.pop()); } };
$('#title').onchange = () => { snap(); D.title = $('#title').value || 'Tanpa judul'; commit(); };
$('#home').onclick = () => Studio.go('index.html');

// ---------- helpers ----------
const page = () => D.pages[cur];
const findEl = id => { for (const [pi, p] of D.pages.entries()) { const e = p.elements.find(x => x.id === id); if (e) return [e, p, pi]; } return []; };
const selected = () => sel.map(id => findEl(id)[0]).filter(Boolean);
const one = () => sel.length === 1 ? findEl(sel[0])[0] : null;
const isShape = e => ['rect', 'ellipse', 'line', 'triangle', 'star'].includes(e.type);
const cssFill = f => !f ? 'transparent' : typeof f === 'string' ? f : `linear-gradient(${f.a ?? 135}deg, ${f.c[0]}, ${f.c[1]})`;
const firstColor = f => typeof f === 'string' ? f : f?.c?.[0] || '#000000';
const hex = c => /^#[0-9a-f]{6}$/i.test(c || '') ? c : '#000000';
const cssFilter = (a, k = 1) => { a = {...ADJ0, ...a}; return `brightness(${a.brightness}%) contrast(${a.contrast}%) saturate(${a.saturate}%) hue-rotate(${a.hue}deg) blur(${a.blur * k}px) grayscale(${a.grayscale}%) sepia(${a.sepia}%)`; };
const imgSrc = s => s && s.startsWith('path:') ? Studio.mediaUrl(s.slice(5)) : s;
function groupIds(e, p) { return e.group ? p.elements.filter(x => x.group === e.group).map(x => x.id) : [e.id]; }
function bbox(els) { const xs = els.flatMap(e => [e.x, e.x + e.w]), ys = els.flatMap(e => [e.y, e.y + e.h]); return {x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs), h: Math.max(...ys) - Math.min(...ys)}; }
function coverBox(e) { // image placement inside its frame (cover + zoom + pan)
  const ar = e.ar || 1, c = {zoom: 1, ox: 0, oy: 0, ...e.crop};
  let cw = e.w, ch = e.w / ar; if (ch < e.h) { ch = e.h; cw = e.h * ar; }
  const sw = cw * c.zoom, sh = ch * c.zoom;
  return {w: sw, h: sh, x: (e.w - sw) / 2 + c.ox * (sw - e.w) / 2, y: (e.h - sh) / 2 + c.oy * (sh - e.h) / 2};
}
function fit() { const w = $('#work').clientWidth - 60, h = $('#work').clientHeight - 90; zoom = Math.max(.05, Math.min(w / D.width, h / D.height, 1.5)); }
const setZoom = z => { zoom = Math.max(.05, Math.min(3, z)); render(); };
$('#zin').onclick = () => setZoom(zoom * 1.2); $('#zout').onclick = () => setZoom(zoom / 1.2);
$('#zoom').oninput = e => setZoom(e.target.value / 100); $('#fit').onclick = () => { fit(); render(); };

// ---------- render ----------
function render() {
  $('#zv').textContent = Math.round(zoom * 100) + '%'; $('#zoom').value = Math.round(zoom * 100);
  $('#pageInfo').textContent = `Halaman ${cur + 1} / ${D.pages.length} · ${D.width}×${D.height}px`;
  const wrap = $('#pages'); wrap.innerHTML = '';
  D.pages.forEach((p, pi) => {
    const box = document.createElement('div'); box.className = 'pagebox' + (pi === cur ? ' cur' : '');
    box.innerHTML = `<div class="pagehead"><span>Halaman ${pi + 1}</span><span class="row">
      <button class="btn ghost" data-a="up" title="Naikkan halaman">${icon('back', 'r90')}</button><button class="btn ghost" data-a="down" title="Turunkan halaman">${icon('back', 'r270')}</button>
      <button class="btn ghost" data-a="dup" title="Duplikat halaman">${icon('copy')}</button><button class="btn ghost" data-a="del" title="Hapus halaman">${icon('trash')}</button>
      <button class="btn ghost" data-a="add" title="Tambah halaman">${icon('plus')}</button></span></div>`;
    box.querySelectorAll('[data-a]').forEach(b => b.onclick = () => pageAction(b.dataset.a, pi));
    box.querySelector('.r90')?.setAttribute('style', 'transform:rotate(90deg)'); box.querySelector('.r270')?.setAttribute('style', 'transform:rotate(270deg)');
    const holder = document.createElement('div'); holder.style.cssText = `width:${D.width * zoom}px;height:${D.height * zoom}px`;
    const pg = document.createElement('div'); pg.className = 'page'; pg.dataset.pi = pi;
    pg.style.cssText = `width:${D.width}px;height:${D.height}px;background:${cssFill(p.bg)};transform:scale(${zoom});--z:${zoom}`;
    for (const e of p.elements) if (!e.hidden) pg.appendChild(elNode(e, pi));
    pg.onpointerdown = ev => { if (ev.target === pg) marquee(ev, pi, pg); };
    pg.ondragover = ev => ev.preventDefault(); pg.ondrop = ev => dropOnPage(ev, pi, pg);
    holder.appendChild(pg); box.appendChild(holder); wrap.appendChild(box);
  });
  for (const n of $$('.el.text')) { const [e] = findEl(n.dataset.id); if (e) e.h = n.offsetHeight; }
  renderTool(); if (ctx) renderCtx(); else if (rail === 'layers') openRail('layers', true);
}
function elNode(e, pi) {
  const n = document.createElement('div'), isSel = sel.includes(e.id);
  n.className = `el ${e.type}${isSel ? ' sel' : ''}`; n.dataset.id = e.id;
  const flip = `${e.flipX ? ' scaleX(-1)' : ''}${e.flipY ? ' scaleY(-1)' : ''}`;
  n.style.cssText = `left:${e.x}px;top:${e.y}px;width:${e.w}px;${e.type === 'text' ? '' : `height:${e.h}px;`}transform:rotate(${e.rot || 0}deg)${flip};opacity:${e.opacity ?? 1}`;
  if (e.shadow?.on && e.type !== 'text') n.style.filter = `drop-shadow(${e.shadow.x}px ${e.shadow.y}px ${e.shadow.blur}px ${e.shadow.color})`;
  if (e.type === 'text') {
    n.textContent = e.text;
    Object.assign(n.style, {fontFamily: `"${e.font}", sans-serif`, fontSize: e.fontSize + 'px', color: e.color, fontWeight: e.bold ? 700 : 400, fontStyle: e.italic ? 'italic' : 'normal',
      textDecoration: e.underline ? 'underline' : 'none', textAlign: e.align, letterSpacing: (e.spacing || 0) + 'px', lineHeight: e.lh || 1.2, textTransform: e.upper ? 'uppercase' : 'none'});
    Object.assign(n.style, textFx(e));
  } else if (e.type === 'image') {
    const box = document.createElement('div'); box.className = 'imgbox'; box.style.borderRadius = (e.radius || 0) + 'px';
    const im = document.createElement('img'); im.src = imgSrc(e.src); im.crossOrigin = 'anonymous'; im.draggable = false;
    const c = coverBox(e); im.style.cssText = `left:${c.x}px;top:${c.y}px;width:${c.w}px;height:${c.h}px;filter:${cssFilter(e.adj)}`;
    if (!e.ar) im.onload = () => { e.ar = im.naturalWidth / im.naturalHeight; render(); };
    box.appendChild(im); n.appendChild(box);
  } else {

  else if (c && k === 'b') { ev.preventDefault(); setAll(x => { if (x.type === 'text') x.bold = !x.bold; }); }

    if (r.error) return Studio.toast('File PPTX dibuat, tapi Canva menolak: ' + r.error, 7000);
    const url = r.canva?.job?.result?.designs?.[0]?.urls?.edit_url;
    Studio.modal(`<h3>Terkirim ke Canva</h3><p>Status: ${esc(r.canva?.job?.status || 'selesai')}</p>${url ? `<p><a href="${esc(url)}" target="_blank" rel="noopener" style="color:var(--accent)">Buka desain di Canva</a></p>` : ''}<div class="actions"><button class="btn primary" onclick="this.closest('.modal-back').remove()">Tutup</button></div>`);
  } catch (err) { Studio.toast('Gagal: ' + err.message, 6000); }
};
addEventListener('resize', () => render());
boot();
</script>
</body>
</html>
