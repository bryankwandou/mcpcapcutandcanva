<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rakit Video</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&family=Plus+Jakarta+Sans:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="studio.css">
<style>
body { display: grid; height: 100%; overflow: hidden; grid-template-rows: 50px minmax(260px, 1fr) 6px var(--tlh, 280px); grid-template-columns: 290px minmax(0, 1fr) 300px;
  grid-template-areas: "top top top" "media player insp" "split split split" "tl tl tl"; }
header { grid-area: top; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--surface); border-bottom: 1px solid var(--line); min-width: 0; }
header select { max-width: 220px; }
#status { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#media { grid-area: media; background: var(--surface); border-right: 1px solid var(--line); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
#mtabs { display: flex; gap: 2px; padding: 6px; border-bottom: 1px solid var(--line); overflow-x: auto; }
#mtabs button { background: none; border: 0; color: var(--muted); border-radius: 6px; padding: 5px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; min-width: 38px; }
#mtabs button.on { color: var(--fg); background: var(--surface-2); }
#mbody { overflow: auto; padding: 10px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; align-content: start; min-height: 0; }
.mgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.mitem { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: grab; text-align: left; padding: 0; display: grid; }
.mitem:hover { border-color: #505767; }
.mitem .th { aspect-ratio: 16/10; background: #0003; display: flex; align-items: center; justify-content: center; color: var(--muted); position: relative; overflow: hidden; }
.mitem .th img { width: 100%; height: 100%; object-fit: cover; }
.mitem .th .tier { position: absolute; right: 4px; top: 4px; }
.mitem .nm { padding: 5px 7px; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#player { grid-area: player; background: var(--well); display: grid; grid-template-rows: minmax(0, 1fr) 44px; min-width: 0; min-height: 0; }
#stageWrap { display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; min-height: 0; }
#stage { position: relative; background: #000; overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
.el { position: absolute; left: 0; top: 0; transform-origin: center; user-select: none; cursor: move; touch-action: none; }
.el img, .el video { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.el.text { white-space: pre; font-weight: 700; text-shadow: 0 2px 6px #000a; font-family: var(--f-body); }
.el.sel { outline: 2px solid var(--select); }
.el.sticker .ph { width: 100%; height: 100%; border: 2px dashed var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--accent); background: #0006; font-size: 12px; text-align: center; }
.h { position: absolute; width: 12px; height: 12px; background: #fff; border: 2px solid var(--select); border-radius: 50%; }
.h.scale { right: -7px; bottom: -7px; cursor: nwse-resize; } .h.rot { left: calc(50% - 6px); top: -26px; cursor: grab; }
.fxnote { position: absolute; left: 8px; font-size: 11px; color: #fff; background: #000a; padding: 3px 7px; border-radius: 5px; pointer-events: none; }
#pctl { display: flex; align-items: center; justify-content: center; gap: 10px; border-top: 1px solid var(--line); background: var(--surface); padding: 0 10px; }
#pctl .tc { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 12px; }
#pctl .tc b { color: var(--fg); } #pctl .tc span { color: var(--muted); }
#insp { grid-area: insp; background: var(--surface); border-left: 1px solid var(--line); overflow: auto; padding: 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-content: start; min-height: 0; min-width: 0; }
#insp h3 { font-size: 15px; }
.sec { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.sec:first-of-type { border-top: 0; padding-top: 0; }
.prop { display: grid; grid-template-columns: 66px minmax(0, 1fr) 54px 22px; gap: 6px; align-items: center; }
.prop input { min-width: 0; }
.prop > span { font-size: 12px; color: var(--muted); }
.prop input[type=number] { width: 100%; }
.kf { background: none; border: 0; color: var(--muted); padding: 2px; display: flex; }
.kf.has { color: var(--accent); } .kf.at { color: var(--accent); filter: drop-shadow(0 0 4px var(--accent)); }
.kf.at svg { fill: currentColor; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips .btn { padding: 4px 9px; }
#split { grid-area: split; background: var(--bg); cursor: ns-resize; border-top: 1px solid var(--line); }
#tl { grid-area: tl; background: var(--surface); display: grid; grid-template-rows: 40px minmax(0, 1fr); min-height: 0; }
#tlbar { display: flex; align-items: center; gap: 4px; padding: 0 10px; border-bottom: 1px solid var(--line); overflow-x: auto; }
#tlbar .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; flex: none; }
#tlScroll { overflow: auto; position: relative; min-height: 0; }
#tlInner { position: relative; min-width: 100%; padding-bottom: 20px; }
#ruler { height: 24px; position: sticky; top: 0; z-index: 6; background: var(--surface); border-bottom: 1px solid var(--line); margin-left: var(--hw); cursor: pointer; }
#ruler span { position: absolute; top: 5px; font: 10px var(--f-mono); color: var(--muted); transform: translateX(3px); }
#ruler i { position: absolute; bottom: 0; width: 1px; height: 6px; background: var(--line); }
.track { position: relative; height: var(--th, 46px); border-bottom: 1px solid #ffffff08; }
.track.main { --th: 58px; background: #ffffff05; }
.track.main .thead { color: var(--fg); }
.thead { overflow: hidden; white-space: nowrap; position: sticky; left: 0; width: var(--hw); height: 100%; background: var(--surface); z-index: 5; display: flex; align-items: center; gap: 6px; padding: 0 10px; color: var(--muted); font-size: 11px; border-right: 1px solid var(--line); float: left; }
.lane { position: absolute; left: var(--hw); right: 0; top: 0; bottom: 0; }
.seg { position: absolute; top: 5px; bottom: 5px; border-radius: 6px; padding: 4px 8px; font-size: 11px; color: #fff; white-space: nowrap; overflow: hidden; cursor: grab; border: 1.5px solid transparent; background-repeat: repeat-x; background-size: auto 100%; display: flex; align-items: flex-start; gap: 4px; }
.seg .lb { background: #0008; padding: 0 4px; border-radius: 3px; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.seg.video, .seg.photo { background-color: #2b6f68; } .seg.audio { background-color: #6b3a27; } .seg.text { background-color: #5a4291; }
.seg.sticker { background-color: #806316; } .seg.effect { background-color: #7c2f4a; } .seg.filter { background-color: #2e5d74; }
.seg.sel { border-color: #fff; box-shadow: 0 0 0 1px #000; }
.seg .edge { position: absolute; top: 0; bottom: 0; width: 8px; cursor: ew-resize; background: #ffffff26; }
.seg .edge.l { left: 0; } .seg .edge.r { right: 0; }
.seg .kfd { position: absolute; bottom: 3px; width: 9px; height: 9px; background: var(--accent); transform: translateX(-50%) rotate(45deg); border: 1px solid #000; }
.seg .wave { position: absolute; left: 0; right: 0; bottom: 0; height: 55%; opacity: .5; background: repeating-linear-gradient(90deg, #fff6 0 2px, transparent 2px 5px); -webkit-mask: linear-gradient(transparent, #000); }
.seg .fade { position: absolute; top: 0; bottom: 0; background: #0007; pointer-events: none; }
.trx { position: absolute; top: 50%; width: 18px; height: 18px; transform: translate(-50%, -50%) rotate(45deg); background: var(--surface); border: 1.5px solid var(--accent); border-radius: 3px; z-index: 3; cursor: pointer; }
.trx.sel { background: var(--accent); }
#playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--fg); z-index: 7; pointer-events: none; }
#playhead::before { content: ""; position: absolute; top: 0; left: -6px; border: 7px solid transparent; border-top: 9px solid var(--fg); }
.snapline { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--accent); z-index: 6; pointer-events: none; }
.empty-tl { padding: 26px; color: var(--muted); }
@media (max-width: 900px) {
  body { grid-template-columns: minmax(0, 1fr); grid-template-rows: 50px minmax(220px, 1fr) 0 230px auto auto; grid-template-areas: "top" "player" "split" "tl" "insp" "media"; overflow: auto; height: auto; }
  #insp, #media { max-height: 360px; border: 0; border-top: 1px solid var(--line); }
  header .hide-sm { display: none; }
}
@media (max-width: 560px) { #deploy .lbl, #status { display: none; } #tlbar .btn:not(.icon) { font-size: 0; gap: 0; } #tlbar .btn svg { font-size: 13px; } #tlZoom { width: 80px !important; } }
</style>
</head>
<body>
<header>
  <button class="btn ghost icon" id="home" title="Beranda"></button>
  <select id="draftSel" aria-label="Project" hidden></select><span id="demoTag" class="tier note" hidden>Mode demo</span>
  <button class="btn ghost icon" id="undo" title="Urungkan (Ctrl+Z)"></button><button class="btn ghost icon" id="redo" title="Ulangi (Ctrl+Y)"></button>
  <span id="status" class="grow"></span>
  <button class="btn hide-sm" id="discard">Buang perubahan</button>
  <button class="btn primary" id="deploy"></button>
</header>
<aside id="media"><nav id="mtabs" aria-label="Aset"></nav><div id="mbody"></div></aside>
<section id="player">
  <div id="stageWrap"><div id="stage"></div></div>
  <div id="pctl"><span class="tc"><b id="tcNow">00:00:00</b> <span>/ <span id="tcEnd">00:00:00</span></span></span>
    <button class="btn icon" id="play" title="Putar (Spasi)"></button><span class="tier note" id="ratio"></span></div>
</section>
<aside id="insp"></aside>
<div id="split" title="Seret untuk mengubah tinggi timeline"></div>
<section id="tl">
  <div id="tlbar"></div>
  <div id="tlScroll"><div id="tlInner"><div id="ruler"></div><div id="tracks"></div><div id="playhead"></div></div></div>
</section>
<script src="studio.js"></script>
<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
ICONS.magnet = 'M6 4v7a6 6 0 0 0 12 0V4h-4v7a2 2 0 0 1-4 0V4zM6 8h4M14 8h4';
const FPS = 30, HW = 92, KF_PROPS = ['x', 'y', 'scale', 'rotation', 'alpha'];
document.body.style.setProperty('--hw', HW + 'px');
let S = null, DRAFT = PARAMS.draft || '', DEMO = false, sel = null, selTrx = null, t = 0, playing = false, pxs = 70, version = 0, snapOn = true, tab = 'media';
const undoS = [], redoS = [], media = {};
let LIB = [], FILES = [];

// ---------- boot ----------
$('#home').innerHTML = icon('home'); $('#undo').innerHTML = icon('undo'); $('#redo').innerHTML = icon('redo'); $('#play').innerHTML = icon('play');
$('#deploy').innerHTML = `${icon('send')}<span class="lbl"> Deploy ke CapCut</span>`;
$('#home').onclick = () => Studio.go('./');
async function boot() {
  await Studio.connect();
  if (Studio.connected) {
    const drafts = await Studio.api('/api/drafts').catch(() => []);
    if (!drafts.length) { DEMO = true; Studio.toast('Belum ada project CapCut. Membuka mode demo.'); }
    else {
      $('#draftSel').hidden = false; $('#draftSel').innerHTML = drafts.map(d => `<option>${esc(d.name)}</option>`).join('');
      if (!drafts.some(d => d.name === DRAFT)) DRAFT = drafts[0].name; $('#draftSel').value = DRAFT;
      $('#draftSel').onchange = e => { DRAFT = e.target.value; sel = null; undoS.length = redoS.length = 0; load(); };
      LIB = await Studio.api('/api/capcut-library').catch(() => []); FILES = await Studio.api('/api/library').catch(() => []);
      await load(); setInterval(pollRemote, 1000);
    }
  } else DEMO = true;
  if (DEMO) { $('#demoTag').hidden = false; loadDemo(); }
  renderTabs(); renderTlbar(); render();
}
async function load() {
  S = await Studio.api('/api/scene?draft=' + encodeURIComponent(DRAFT)); version = S.version || 0; norm();
  status(version ? 'Ada perubahan yang belum di-deploy' : 'Sama dengan project di CapCut'); fitTl(); render();
}
function norm() { for (const e of S.elements) { e.speed ??= 1; e.source_start ??= 0; e.fade_in ??= 0; e.fade_out ??= 0; e.keyframes ??= {}; } }
async function pollRemote() {
  if (DEMO || dragging) return;
  try { const v = (await Studio.api('/api/version?draft=' + encodeURIComponent(DRAFT))).version;
    if (v > version) { S = await Studio.api('/api/scene?draft=' + encodeURIComponent(DRAFT)); version = v; norm(); status('Diperbarui oleh AI'); render(); } } catch {}
}
const status = m => { $('#status').textContent = m; };

// ---------- demo project (generated locally, no stock content) ----------
function toneWav(sec = 12, rate = 8000) { // soft two-chord pad, 8-bit mono
  const n = sec * rate, buf = new Uint8Array(44 + n), v = new DataView(buf.buffer), w = (o, s) => [...s].forEach((c, i) => buf[o + i] = c.charCodeAt(0));
  w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
  for (let i = 0; i < n; i++) { const s = i / rate, ch = Math.floor(s / 3) % 2 ? [220, 277.2, 329.6] : [196, 246.9, 293.7], env = Math.min(1, s * 2, (sec - s) * 2);
    buf[44 + i] = 128 + Math.round(env * 16 * ch.reduce((a, f) => a + Math.sin(2 * Math.PI * f * s), 0)); }
  let bin = ''; for (let i = 0; i < buf.length; i += 8192) bin += String.fromCharCode(...buf.subarray(i, i + 8192)); return 'data:audio/wav;base64,' + btoa(bin);
}
function starPng(c = '#F4C95D') { const k = document.createElement('canvas'); k.width = k.height = 200; const x = k.getContext('2d'); x.fillStyle = c; x.beginPath();
  for (let i = 0; i < 10; i++) { const r = i % 2 ? 40 : 95, a = -Math.PI / 2 + i * Math.PI / 5; x.lineTo(100 + r * Math.cos(a), 100 + r * Math.sin(a)); } x.fill(); return k.toDataURL(); }
function loadDemo() {
  DRAFT = 'demo';
  const pics = [['Pagi di pasar', '#D95D39', '#F4C95D'], ['Kopi tubruk', '#7A4A2A', '#E8B02A'], ['Senja di pantai', '#FF8C5A', '#2A1B3D'], ['Sampai jumpa', '#1F6FB2', '#36C5B1']].map(([l, a, b]) => ({l, src: demoImage(l, a, b, 1080, 1920)}));
  FILES = [...pics.map(p => ({type: 'photo', name: p.l + '.jpg', path: p.src})), {type: 'audio', name: 'Musik contoh.wav', path: toneWav(), dur: 12}];
  LIB = [{key: 'demo:sticker:bintang', kind: 'sticker', name: 'Bintang', vip: false, preview: starPng()}, {key: 'demo:sticker:bintang-pro', kind: 'sticker', name: 'Bintang emas', vip: true, preview: starPng('#E8B02A')},
    {key: 'demo:effect:shake', kind: 'effect', name: 'Getar', vip: false}, {key: 'demo:effect:glitch', kind: 'effect', name: 'Glitch', vip: true},
    {key: 'demo:filter:hangat', kind: 'filter', name: 'Hangat', vip: false}, {key: 'demo:filter:film', kind: 'filter', name: 'Film klasik', vip: true},
    {key: 'demo:transition:fade', kind: 'transition', name: 'Larut', vip: false}, {key: 'demo:transition:zoom', kind: 'transition', name: 'Zoom putar', vip: true}];
  let saved = null; try { saved = JSON.parse(ls('demoScene') || 'null'); } catch {}
  if (saved?.v === 3) S = saved;
  else {
    const vt = uid(), tt = uid(), at = uid(), st = uid();
    const clip = (i, start, extra = {}) => ({id: uid(), track: vt, type: 'photo', src: pics[i].src, name: pics[i].l, start, duration: 3, x: 0, y: 0, scale: 1, rotation: 0, alpha: 1, volume: 1, speed: 1, source_start: 0, fade_in: 0, fade_out: 0, keyframes: {}, ...extra});
    S = {v: 3, draft: 'demo', width: 1080, height: 1920, tracks: [{id: st, type: 'sticker'}, {id: tt, type: 'text'}, {id: vt, type: 'video'}, {id: at, type: 'audio'}], elements: [
      clip(0, 0, {keyframes: {scale: [{t: 0, v: 1}, {t: 3, v: 1.25}]}, transition: {key: 'demo:transition:fade', name: 'Larut', duration: .6}}), clip(1, 3, {transition: {key: 'demo:transition:fade', name: 'Larut', duration: .6}}), clip(2, 6), clip(3, 9),
      {id: uid(), track: tt, type: 'text', text: 'Jalan-jalan\nakhir pekan', start: .3, duration: 2.6, x: 0, y: .45, scale: 1.2, rotation: 0, alpha: 1, volume: 1, color: '#FFFFFF', font_size: 11, speed: 1, source_start: 0, fade_in: 0, fade_out: 0, keyframes: {alpha: [{t: 0, v: 0}, {t: .5, v: 1}]}},
      {id: uid(), track: tt, type: 'text', text: 'Ikuti untuk part 2', start: 9.3, duration: 2.5, x: 0, y: -.55, scale: 1, rotation: 0, alpha: 1, volume: 1, color: '#F4C95D', font_size: 9, speed: 1, source_start: 0, fade_in: 0, fade_out: 0, keyframes: {}},
      {id: uid(), track: st, type: 'sticker', label: 'Bintang', lib: 'demo:sticker:bintang', preview: LIB[0].preview, start: 6.2, duration: 2.6, x: .55, y: .6, scale: .8, rotation: 12, alpha: 1, volume: 1, speed: 1, source_start: 0, fade_in: 0, fade_out: 0, keyframes: {rotation: [{t: 0, v: -10}, {t: 2.6, v: 20}]}},
      {id: uid(), track: at, type: 'audio', src: FILES[4].path, name: 'Musik contoh', start: 0, duration: 12, x: 0, y: 0, scale: 1, rotation: 0, alpha: 1, volume: .8, speed: 1, source_start: 0, fade_in: 1, fade_out: 2, keyframes: {}},
    ]};
  }
  status('Contoh project. Perubahan tersimpan di browser ini.'); fitTl();
}

// ---------- history & saving ----------
let before = null, saveT, dragging = false;
const snap = () => { if (before === null) before = JSON.stringify(S); };
function commit() {
  if (before !== null && before !== JSON.stringify(S)) { undoS.push(before); if (undoS.length > 100) undoS.shift(); redoS.length = 0; }
  before = null; render(); save();
}
function save() {
  clearTimeout(saveT); status(DEMO ? 'Menyimpan…' : 'Menyimpan pratinjau…');
  saveT = setTimeout(async () => {
    if (DEMO) { status(lsSet('demoScene', JSON.stringify(S)) ? 'Tersimpan di browser (demo)' : 'Demo tidak bisa disimpan di browser ini'); return; }
    try { const r = await Studio.api('/api/scene', {method: 'PUT', body: JSON.stringify(S)}); version = r.version; status('Pratinjau tersimpan, belum di-deploy'); }
    catch (err) { status('Gagal menyimpan: ' + err.message); }
  }, 300);
}
const restore = j => { S = JSON.parse(j); if (sel && !S.elements.some(e => e.id === sel)) sel = null; render(); save(); };
$('#undo').onclick = () => { if (undoS.length) { redoS.push(JSON.stringify(S)); restore(undoS.pop()); } };
$('#redo').onclick = () => { if (redoS.length) { undoS.push(JSON.stringify(S)); restore(redoS.pop()); } };
$('#deploy').onclick = async () => {
  if (DEMO) return Studio.modal(`<h3>Deploy ke CapCut</h3><p>Ini mode demo. Untuk menulis hasil edit ke project CapCut di komputer Anda, jalankan <span class="mono">creative-mcp studio</span> lalu buka project dari menu Project video.</p><div class="actions"><button class="btn primary" onclick="this.closest('.modal-back').remove()">Mengerti</button></div>`);
  if (!await Studio.confirm('Deploy ke CapCut?', `Semua perubahan ditulis ke project "${DRAFT}". Tutup project ini di CapCut dulu, lalu buka lagi setelah deploy. Cadangan .json.bak dibuat otomatis.`, 'Deploy')) return;
  clearTimeout(saveT); await Studio.api('/api/scene', {method: 'PUT', body: JSON.stringify(S)});
  try { const r = await Studio.api('/api/deploy?draft=' + encodeURIComponent(DRAFT), {method: 'POST'}); Studio.toast(`Deploy selesai: ${r.elements} elemen (+${r.added}, −${r.removed}). Buka ulang project di CapCut.`, 6000); await load(); }
  catch (err) { Studio.toast('Deploy gagal: ' + err.message, 6000); }
};
$('#discard').onclick = async () => {
  if (!await Studio.confirm('Buang semua perubahan?', DEMO ? 'Contoh project dikembalikan ke awal.' : 'Pratinjau dikembalikan ke isi project CapCut yang terakhir disimpan.', 'Buang', true)) return;
  if (DEMO) { try { localStorage.removeItem('demoScene'); } catch {} loadDemo(); render(); return; }
  await Studio.api('/api/discard?draft=' + encodeURIComponent(DRAFT), {method: 'POST'}); await load();
};

// ---------- model helpers ----------
const byId = id => S.elements.find(e => e.id === id);
const trackOf = e => S.tracks.find(k => k.id === e.track);
const kindOf = type => type === 'photo' ? 'video' : type;
const compatible = (trackType, elType) => trackType === kindOf(elType);
const end = e => e.start + e.duration;
const total = () => Math.max(1, ...S.elements.map(end));
const mediaUrl = p => Studio.mediaUrl(p);
const tc = s => { s = Math.max(0, s); const m = Math.floor(s / 60), sec = Math.floor(s % 60), f = Math.floor((s % 1) * FPS); return [m, sec, f].map(n => String(n).padStart(2, '0')).join(':'); };
function val(e, k, tl = t - e.start) { // keyframe interpolation (linear, clamped)
  const kf = e.keyframes?.[k]; if (!kf?.length) return e[k] ?? (k === 'scale' || k === 'alpha' || k === 'volume' ? 1 : 0);
  const a = [...kf].sort((p, q) => p.t - q.t); if (tl <= a[0].t) return a[0].v; if (tl >= a[a.length - 1].t) return a[a.length - 1].v;
  for (let i = 1; i < a.length; i++) if (tl <= a[i].t) { const p = a[i - 1], q = a[i], r = (tl - p.t) / (q.t - p.t || 1); return p.v + (q.v - p.v) * r; }
}
function setVal(e, k, v) { // edits a keyframe at the playhead when the property is animated (CapCut behaviour)

      <div class="prop" style="grid-template-columns:110px 1fr"><span>Kanvas</span><span class="mono">${S.width}×${S.height}</span><span>Durasi</span><span class="mono">${tc(dur)}</span><span>Track</span><span class="mono">${S.tracks.length}</span><span>Elemen</span><span class="mono">${S.elements.length}</span></div></div>
      <div class="sec"><div class="label">Cara pakai</div><p style="margin:0;color:var(--muted)">Seret media dari panel kiri ke timeline. Klik klip untuk mengatur posisi, kecepatan, keyframe, audio, dan transisi. Spasi = putar, S = potong, Delete = hapus.</p></div>
      ${DEMO ? '<div class="sec"><p style="margin:0;color:var(--muted)">Ini contoh project yang dibuat Studio. Hubungkan komputer untuk mengedit project CapCut asli.</p></div>' : ''}`;
    return;
  }
  if (selTrx === e.id && e.transition) {
    I.innerHTML = `<h3>Transisi</h3><div class="sec"><div class="row"><b class="grow">${esc(e.transition.name)}</b>${e.transition.vip ? '<span class="tier pro">PRO</span>' : '<span class="tier free">Gratis</span>'}</div>
      <div class="prop" style="grid-template-columns:74px 1fr 58px"><span>Durasi</span><input type="range" id="trD" min="0.1" max="3" step="0.1" value="${e.transition.duration}"><input type="number" id="trDn" step="0.1" value="${e.transition.duration}"></div>
      <p style="margin:0;color:var(--muted);font-size:12px">Pratinjau di sini berupa crossfade sederhana. Gerakan asli transisi dirender oleh CapCut setelah deploy.</p>
      <button class="btn" id="trDel">${icon('trash')} Hapus transisi</button></div>`;
    const setD = v => { snap(); e.transition.duration = Math.max(.1, +v); commit(); };
    $('#trD').onchange = ev => setD(ev.target.value); $('#trDn').onchange = ev => setD(ev.target.value); $('#trDel').onclick = del; return;
  }
  const names = {video: 'Video', photo: 'Foto', audio: 'Audio', text: 'Teks', sticker: 'Stiker', effect: 'Efek', filter: 'Filter'};
  const prop = (k, l, lo, hi, step) => `<div class="prop"><span>${l}</span><input type="range" data-r="${k}" min="${lo}" max="${hi}" step="${step}" value="${val(e, k)}"><input type="number" data-v="${k}" step="${step}" value="${(+val(e, k)).toFixed(step < 1 ? 2 : 0)}">
    <button class="kf${e.keyframes?.[k]?.length ? ' has' : ''}${kfAt(e, k) ? ' at' : ''}" data-kf="${k}" title="Keyframe ${l.toLowerCase()} di playhead">${icon('diamond')}</button></div>`;
  let h = `<div class="row"><h3 class="grow">${names[e.type]}${e.label ? ': ' + esc(e.label) : ''}</h3>${e.vip ? '<span class="tier pro">PRO</span>' : e.lib ? '<span class="tier free">Gratis</span>' : ''}</div>
    <div class="sec"><div class="label">Waktu</div><div class="prop" style="grid-template-columns:74px 1fr 74px 1fr"><span>Mulai</span><input type="number" id="pStart" step="0.1" value="${e.start.toFixed(2)}"><span>Durasi</span><input type="number" id="pDur" step="0.1" value="${e.duration.toFixed(2)}"></div></div>`;
  if (e.type === 'text') h += `<div class="sec"><div class="label">Teks</div><textarea id="pText" rows="3">${esc(e.text)}</textarea>
    <div class="prop" style="grid-template-columns:74px 1fr 74px 1fr"><span>Warna</span><input type="color" id="pColor" value="${/^#[0-9a-f]{6}$/i.test(e.color) ? e.color : '#ffffff'}"><span>Ukuran</span><input type="number" id="pFs" step="0.5" value="${e.font_size}"></div></div>`;
  if (['video', 'photo', 'text', 'sticker'].includes(e.type)) h += `<div class="sec"><div class="label">Dasar · posisi & skala</div>
    ${prop('x', 'Posisi X', -1.5, 1.5, .01)}${prop('y', 'Posisi Y', -1.5, 1.5, .01)}${prop('scale', 'Skala', .05, 5, .01)}${prop('rotation', 'Rotasi', -180, 180, 1)}${prop('alpha', 'Opacity', 0, 1, .01)}
    <button class="btn" id="pReset">Reset posisi</button></div>`;
  if (e.type === 'video' || e.type === 'audio') h += `<div class="sec"><div class="label">Kecepatan</div><div class="chips">${[.5, 1, 1.5, 2, 3].map(s => `<button class="btn${e.speed === s ? ' on' : ''}" data-sp="${s}">${s}×</button>`).join('')}</div>
    <div class="prop" style="grid-template-columns:74px 1fr 58px"><span>Kustom</span><input type="range" id="pSp" min="0.1" max="10" step="0.1" value="${e.speed}"><input type="number" id="pSpn" min="0.1" max="10" step="0.1" value="${e.speed}"></div>
    <p style="margin:0;color:var(--muted);font-size:12px">Durasi klip menyesuaikan kecepatan. Kurva kecepatan belum tersedia.</p></div>
    <div class="sec"><div class="label">Audio</div>${prop('volume', 'Volume', 0, 2, .01)}
    <div class="prop" style="grid-template-columns:74px 1fr 74px 1fr"><span>Fade in</span><input type="number" id="pFi" min="0" step="0.1" value="${e.fade_in}"><span>Fade out</span><input type="number" id="pFo" min="0" step="0.1" value="${e.fade_out}"></div></div>`;
  if (['video', 'photo'].includes(e.type)) { const trs = LIB.filter(i => i.kind === 'transition');
    h += `<div class="sec"><div class="label">Transisi ke klip berikutnya</div><select id="pTr"><option value="">Tanpa transisi</option>${trs.map(i => `<option value="${esc(i.key)}" ${e.transition?.key === i.key ? 'selected' : ''}>${esc(i.name)}${i.vip ? ' (PRO)' : ''}</option>`).join('')}</select>
      ${trs.length ? '' : '<p style="margin:0;color:var(--muted);font-size:12px">Belum ada transisi di library. Scan project CapCut Anda dari Beranda → Library CapCut.</p>'}</div>`; }
  if (['effect', 'filter'].includes(e.type)) h += `<div class="sec"><p style="margin:0;color:var(--muted)">${e.type === 'effect' ? 'Efek' : 'Filter'} ini berasal dari library CapCut Anda. Tampilan aslinya dirender oleh CapCut; di sini ditandai dengan label di pojok player.</p></div>`;
  h += `<div class="sec"><div class="row"><button class="btn" id="pSplit">${icon('scissors')} Potong</button><button class="btn" id="pDup">${icon('copy')} Duplikat</button><button class="btn" id="pDel">${icon('trash')} Hapus</button></div></div>`;
  I.innerHTML = h;
  const num = (id, fn) => { const x = $('#' + id); if (x) x.onchange = () => { snap(); fn(+x.value); commit(); }; };
  num('pStart', v => e.start = Math.max(0, v)); num('pDur', v => e.duration = Math.max(.1, v)); num('pFs', v => e.font_size = Math.max(1, v));
  num('pFi', v => e.fade_in = Math.max(0, Math.min(v, e.duration))); num('pFo', v => e.fade_out = Math.max(0, Math.min(v, e.duration)));
  const tx = $('#pText'); if (tx) { tx.onfocus = snap; tx.oninput = () => { e.text = tx.value; renderStage(); }; tx.onchange = commit; }
  const co = $('#pColor'); if (co) { co.oninput = () => { snap(); e.color = co.value; renderStage(); }; co.onchange = commit; }
  I.querySelectorAll('[data-r]').forEach(r => { r.oninput = () => { snap(); setVal(e, r.dataset.r, +r.value); renderStage(); renderInsp(true); }; r.onchange = commit; });
  I.querySelectorAll('[data-v]').forEach(n => { n.onchange = () => { snap(); setVal(e, n.dataset.v, +n.value); commit(); }; });
  I.querySelectorAll('[data-kf]').forEach(b => b.onclick = () => { const k = b.dataset.kf, tl = +(t - e.start).toFixed(3);
    if (tl < 0 || tl > e.duration) return Studio.toast('Pindahkan playhead ke dalam klip ini dulu.');
    snap(); const cur = val(e, k); if (kfAt(e, k)) { e.keyframes[k] = e.keyframes[k].filter(p => Math.abs(p.t - tl) >= .04); if (!e.keyframes[k].length) { delete e.keyframes[k]; e[k] = cur; } }
    else (e.keyframes[k] ||= []).push({t: tl, v: cur}); commit(); });
  const setSpeed = v => { snap(); v = Math.max(.1, Math.min(10, +v)); const src = e.duration * e.speed; e.speed = +v.toFixed(2); e.duration = +(src / e.speed).toFixed(3); commit(); };
  I.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => setSpeed(b.dataset.sp)); const sp = $('#pSp'); if (sp) sp.onchange = () => setSpeed(sp.value); const spn = $('#pSpn'); if (spn) spn.onchange = () => setSpeed(spn.value);
  const tr = $('#pTr'); if (tr) tr.onchange = () => { snap(); const i = LIB.find(x => x.key === tr.value); if (i) e.transition = {key: i.key, name: i.name, duration: e.transition?.duration || .5, vip: i.vip}; else delete e.transition; commit(); };
  const rs = $('#pReset'); if (rs) rs.onclick = () => { snap(); for (const k of KF_PROPS) delete e.keyframes[k]; Object.assign(e, {x: 0, y: 0, scale: 1, rotation: 0, alpha: 1}); commit(); };
  $('#pSplit').onclick = split; $('#pDup').onclick = dup; $('#pDel').onclick = del;
}

// ---------- media panel ----------
const TABS = [['media', 'film', 'Media'], ['audio', 'music', 'Audio'], ['text', 'text', 'Teks'], ['sticker', 'star', 'Stiker'], ['effect', 'wand', 'Efek'], ['transition', 'transition', 'Transisi'], ['filter', 'filter', 'Filter']];
function renderTabs() { $('#mtabs').innerHTML = TABS.map(([k, i, l]) => `<button data-t="${k}" class="${k === tab ? 'on' : ''}">${icon(i)}${l}</button>`).join(''); $$('#mtabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; renderTabs(); }); renderMedia(); }
function mitem(thumb, name, data, badge = '') {
  const b = document.createElement('button'); b.className = 'mitem'; b.draggable = true; b.title = name + (data.lib ? '' : ' · klik untuk menambah di playhead');
  b.innerHTML = `<div class="th">${thumb}${badge}</div><div class="nm">${esc(name)}</div>`;
  b.ondragstart = ev => ev.dataTransfer.setData('text/plain', JSON.stringify(data)); b.onclick = () => addAtPlayhead(data); return b;
}
function renderMedia() {
  const B = $('#mbody'); B.innerHTML = ''; const grid = document.createElement('div'); grid.className = 'mgrid';
  const note = txt => B.insertAdjacentHTML('beforeend', `<p style="margin:0;color:var(--muted);font-size:12px">${txt}</p>`);
  if (tab === 'media' || tab === 'audio') {
    const items = FILES.filter(f => tab === 'audio' ? f.type === 'audio' : f.type !== 'audio');
    note(DEMO ? 'Gambar & musik contoh buatan Studio. Hubungkan komputer untuk memakai file Anda sendiri.' : 'File dari folder Video, Gambar, Musik, Unduhan & Desktop di komputer Anda.');
    if (!items.length) note('Tidak ada file.');
    for (const f of items.slice(0, 200)) grid.appendChild(mitem(f.type === 'photo' ? `<img loading="lazy" src="${esc(mediaUrl(f.path))}" alt="">` : icon(f.type === 'audio' ? 'music' : 'film'), f.name, {type: f.type, path: f.path, dur: f.dur, name: f.name}));
  } else if (tab === 'text') {
    for (const [l, d] of [['Judul', {new: 'text', text: 'JUDUL', font_size: 14, y: .5}], ['Subjudul', {new: 'text', text: 'Subjudul', font_size: 9}], ['Caption', {new: 'text', text: 'Tulis caption di sini', font_size: 7, y: -.6}], ['Sorotan', {new: 'text', text: 'PROMO!', font_size: 12, color: '#F4C95D'}]])
      grid.appendChild(mitem(`<b style="font-size:${10 + d.font_size}px;color:${d.color || '#fff'}">${l}</b>`, l, d));
    note('Klik untuk menambah di posisi playhead, atau seret ke timeline.');
  } else {
    const items = LIB.filter(i => i.kind === tab || (tab === 'filter' && i.kind === 'adjust'));
    note(DEMO ? 'Item contoh. Di project asli, isinya adalah elemen yang pernah Anda pakai di CapCut (scan dari Beranda → Library CapCut).' : 'Elemen dari project CapCut Anda. PRO = butuh langganan CapCut saat dirender.');
    if (!items.length) note('Belum ada. Scan project CapCut Anda dari Beranda → Library CapCut.');
    if (tab === 'transition') note('Seret ke klip di timeline, atau pilih klip lalu klik transisi.');
    const ic = {sticker: 'star', effect: 'wand', transition: 'transition', filter: 'filter', adjust: 'adjust'};
    for (const i of items) grid.appendChild(mitem(i.preview ? `<img src="${esc(mediaUrl(i.preview))}" alt="" style="object-fit:contain;padding:10px">` : icon(ic[i.kind] || 'sparkles'), i.name,
      {lib: i.key, kind: i.kind, name: i.name, vip: i.vip, preview: i.preview}, `<span class="tier ${i.vip ? 'pro' : 'free'}">${i.vip ? 'PRO' : 'Gratis'}</span>`));
  }
  B.appendChild(grid);
}

// ---------- keyboard, resize, render ----------
addEventListener('keydown', ev => {
  if (ev.target.matches('input,textarea,select')) return; const c = ev.ctrlKey || ev.metaKey, k = ev.key.toLowerCase();
  if (ev.key === ' ') { ev.preventDefault(); togglePlay(); }
  else if (c && k === 'z') { ev.preventDefault(); ev.shiftKey ? $('#redo').click() : $('#undo').click(); }
  else if (c && k === 'y') { ev.preventDefault(); $('#redo').click(); }
  else if ((c && k === 'b') || (!c && k === 's')) { ev.preventDefault(); split(); }
  else if (c && k === 'd') { ev.preventDefault(); dup(); }
  else if (ev.key === 'Delete' || ev.key === 'Backspace') { ev.preventDefault(); del(); }
  else if (ev.key === 'ArrowLeft') { ev.preventDefault(); seek(t - (ev.shiftKey ? 1 : 1 / FPS)); }
  else if (ev.key === 'ArrowRight') { ev.preventDefault(); seek(t + (ev.shiftKey ? 1 : 1 / FPS)); }
  else if (ev.key === 'Home') seek(0); else if (ev.key === 'End') seek(total());
  else if (ev.key === 'Escape') { sel = null; selTrx = null; render(); }
});
$('#split').onpointerdown = ev => { const y0 = ev.clientY, h0 = $('#tl').offsetHeight;
  const mv = m => { document.body.style.setProperty('--tlh', Math.max(150, Math.min(innerHeight - 260, h0 - (m.clientY - y0))) + 'px'); fitStage(); renderStage(); };
  const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); }; addEventListener('pointermove', mv); addEventListener('pointerup', up); };
$('#tlScroll').addEventListener('wheel', ev => { if (ev.ctrlKey || ev.metaKey) { ev.preventDefault(); pxs = Math.max(8, Math.min(240, pxs * (ev.deltaY < 0 ? 1.15 : 1 / 1.15))); renderTlbar(); renderTimeline(); } }, {passive: false});
$('#tlScroll').addEventListener('pointerdown', ev => { if (ev.target.classList.contains('lane') || ev.target.id === 'tracks') { sel = null; selTrx = null; render(); } });
function render() { if (!S) return; fitStage(); renderStage(); renderTimeline(); renderInsp(); }
addEventListener('resize', render);
boot();
</script>
</body>
