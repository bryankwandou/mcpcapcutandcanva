// ---------- media panel ----------
const TABS = [['media', 'film', 'Media'], ['audio', 'music', 'Audio'], ['text', 'text', 'Teks'], ['sticker', 'star', 'Stiker'], ['effect', 'wand', 'Efek'], ['transition', 'transition', 'Transisi'], ['filter', 'filter', 'Filter'], ['adjust', 'adjust', 'Penyesuaian']];

  sticker: LIBSUB, effect: LIBSUB, transition: LIBSUB, filter: LIBSUB, adjust: [['all', 'Penyesuaian'], ['free', 'Gratis']]};
function renderTabs() {
  $('#mtabs').innerHTML = TABS.map(([k, i, l]) => `<button data-t="${k}" class="${k === tab ? 'on' : ''}" aria-pressed="${k === tab}">${icon(i)}${l}</button>`).join('');
  $$('#mtabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; renderTabs(); });
  const cur = sub[tab] || SUBS[tab][0][0];

const fmtDur = d => d ? (d >= 60 ? `${Math.floor(d / 60)}:${String(Math.round(d % 60)).padStart(2, '0')}` : `00:${String(Math.round(d)).padStart(2, '0')}`) : '';
function mitem(thumb, name, data, {vip, dur, temp, orig} = {}) {
  const b = document.createElement('div'); b.className = 'mitem'; b.draggable = true; b.tabIndex = 0; b.setAttribute('role', 'button'); b.title = name + (orig ? ' · Gratis · pratinjau saja (tidak ikut di-deploy)' : '') + ' · klik atau ＋ untuk menambah di playhead';
  b.innerHTML = `<div class="th">${thumb}${vip ? '<span class="tier pro">PRO</span>' : orig ? '<span class="tier free">Gratis</span>' : ''}${temp ? '<span class="tmp">sementara</span>' : ''}${dur ? `<span class="dur">${fmtDur(dur)}</span>` : ''}${orig && !dur ? '<span class="tier prev pv">Pratinjau</span>' : ''}
    <button class="add" type="button" title="Tambah di playhead" aria-label="Tambah ${esc(name)} di playhead">${icon('plus')}</button></div><div class="nm">${esc(name)}</div>`;
  b.ondragstart = ev => ev.dataTransfer.setData('text/plain', JSON.stringify(data));

  b.querySelector('.add').onclick = ev => { ev.stopPropagation(); addAtPlayhead(data); }; return b;
}
function arow(it, sfx) { // a synthesised music bed / sound effect row: ▶ audition, click or ＋ adds at playhead
  const r = document.createElement('div'), data = {gen: it.id, name: it.name, dur: it.dur}; r.className = 'arow'; r.draggable = true; r.tabIndex = 0; r.setAttribute('role', 'button'); r.title = `${it.name} · klik atau ＋ untuk menambah di playhead`;
  const col = it.color || '#3dd6e0';
  r.innerHTML = `<div class="cv" style="background:linear-gradient(135deg, ${col}, ${col}55)"><button type="button" class="aud" title="Dengarkan" aria-label="Dengarkan ${esc(it.name)}">${icon('play')}</button></div>
    <div class="t"><b>${esc(it.name)}</b><span>${sfx ? 'Efek suara' : `${esc(it.mood)} · ${it.bpm} BPM`} · ${fmtDur(Math.round(it.dur)) || it.dur.toFixed(1) + 's'} · Gratis</span></div><button type="button" class="add" title="Tambah di playhead" aria-label="Tambah ${esc(it.name)}">${icon('plus')}</button>`;
  r.ondragstart = ev => ev.dataTransfer.setData('text/plain', JSON.stringify(data));
  r.onclick = () => addAtPlayhead(data); r.onkeydown = ev => { if (ev.key === 'Enter' && ev.target === r) addAtPlayhead(data); };
  r.querySelector('.add').onclick = ev => { ev.stopPropagation(); addAtPlayhead(data); };
  const ab = r.querySelector('.aud'); ab.onclick = async ev => { ev.stopPropagation();
    if (previewAudio?.dataset.id === it.id && !previewAudio.paused) { previewAudio.pause(); ab.innerHTML = icon('play'); return; }
    previewAudio?.pause(); $$('.arow .aud').forEach(x => x.innerHTML = icon('play')); r.classList.add('busy');
    try { const u = await RAKIT.audio.ensure(it.id); previewAudio = new Audio(u); previewAudio.dataset.id = it.id; previewAudio.onended = () => { ab.innerHTML = icon('play'); }; await previewAudio.play(); ab.innerHTML = icon('pause'); }
    catch { Studio.toast('Audio tidak bisa diputar di browser ini.'); } finally { r.classList.remove('busy'); } };

function importFiles(list) {
  let n = 0;
  for (const f of list) {
    const type = /^video\//.test(f.type) ? 'video' : /^audio\//.test(f.type) ? 'audio' : /^image\//.test(f.type) ? 'photo' : null; if (!type) continue;
    const item = {type, name: f.name, path: URL.createObjectURL(f), temp: true}; FILES.unshift(item); n++;
    if (type !== 'photo') { const m = document.createElement(type === 'video' ? 'video' : 'audio'); m.preload = 'metadata';
      m.onloadedmetadata = () => { if (isFinite(m.duration)) { item.dur = +m.duration.toFixed(2); renderMedia(); } m.removeAttribute('src'); }; m.src = item.path; }
  }
  if (!n) return Studio.toast('Format tidak didukung. Pilih video, audio, atau gambar.');
  Studio.toast(`${n} file diimpor sementara (hanya sesi ini${DEMO ? ', tidak masuk project CapCut' : ''}).`); renderMedia();
}
$('#fileIn').onchange = ev => { importFiles([...ev.target.files]); ev.target.value = ''; };

  } else if (tab === 'media') note('Library stok tidak disertakan. Pakai file Anda sendiri (Lokal) atau elemen dari library CapCut di tab Stiker, Efek, Transisi, dan Filter.');

    const list = document.createElement('div'); list.className = 'alist';

    note('Disintesis di browser saat pertama dipakai. Bebas royalti. Pratinjau saja — tidak ikut di-deploy ke CapCut.');

    try { $('#script').value = sessionStorage.getItem('rakitScript') || ''; } catch {}
    $('#script').oninput = ev => { try { sessionStorage.setItem('rakitScript', ev.target.value); } catch {} };
    $('#scriptGo').onclick = () => captionsFromScript($('#script').value);
  } else if (tab === 'text') {
    const P = cur === 'template' ? RAKIT.TEXTS.map(x => [x.name, {new: 'text', ...JSON.parse(JSON.stringify(x)), color: x.tstyle.color && x.tstyle.color !== 'transparent' ? x.tstyle.color : '#FFFFFF'}])
      : [['Judul', {new: 'text', text: 'JUDUL', font_size: 14, y: .5}], ['Subjudul', {new: 'text', text: 'Subjudul', font_size: 9}], ['Caption', {new: 'text', text: 'Tulis caption di sini', font_size: 7, y: -.6}], ['Sorotan', {new: 'text', text: 'PROMO!', font_size: 12, color: '#F4C95D'}]];
    if (cur === 'template') note('Template teks Rakit (orisinal) dengan animasi masuk/keluar. Gaya kotak/neon/garis tepi tampil di pratinjau; CapCut menerima teks dan warnanya.');

// ---------- keyboard, resize, render ----------
addEventListener('keydown', ev => {
  if (ev.target.matches('input,textarea,select')) return; const c = ev.ctrlKey || ev.metaKey, k = ev.key.toLowerCase();
  if (ev.key === ' ') { ev.preventDefault(); togglePlay(); }
  else if (c && k === 'z') { ev.preventDefault(); ev.shiftKey ? redo() : undo(); }
  else if (c && k === 'y') { ev.preventDefault(); redo(); }
  else if (c && k === 's') { ev.preventDefault(); saveNow(); }
  else if ((c && k === 'b') || (!c && k === 's')) { ev.preventDefault(); split(); }
  else if (c && k === 'd') { ev.preventDefault(); dup(); }
  else if (ev.altKey && ev.code === 'KeyK') { ev.preventDefault(); toggleKf(); }
  else if (!c && ['j', 'k', 'l'].includes(k)) { ev.preventDefault(); shuttle({j: -1, k: 0, l: 1}[k]); }
  else if (ev.key === 'Delete' || ev.key === 'Backspace') { ev.preventDefault(); del(ev.shiftKey); }
  else if (ev.key === 'ArrowLeft') { ev.preventDefault(); seek(t - (ev.shiftKey ? 1 : 1 / FPS)); }
  else if (ev.key === 'ArrowRight') { ev.preventDefault(); seek(t + (ev.shiftKey ? 1 : 1 / FPS)); }
  else if (ev.key === 'Home') seek(0); else if (ev.key === 'End') seek(total());
  else if (ev.key === 'Escape') { sel = null; selTrx = null; render(); }
});
$('#split').onpointerdown = ev => { const y0 = ev.clientY, h0 = $('#tl').offsetHeight;

$('#tlScroll').addEventListener('pointermove', ev => { if (!axisOn || dragging || playing) return; const x = ev.clientX - $('#tlInner').getBoundingClientRect().left - HW; if (x < 0) return;
  let ax = $('.axis'); if (!ax) { ax = document.createElement('div'); ax.className = 'axis'; $('#tlInner').appendChild(ax); } ax.style.left = HW + x + 'px';
  const keep = t; t = Math.min(total(), x / pxs); renderStage(); t = keep; });
