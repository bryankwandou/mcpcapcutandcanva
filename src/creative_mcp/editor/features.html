<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fitur Free & Pro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&family=Plus+Jakarta+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="studio.css">
<style>
body { height: auto; min-height: 100%; }
.wrap { max-width: 1100px; margin: 0 auto; padding-block: 24px 60px; padding-inline: clamp(16px, 4vw, 40px); display: grid; gap: 22px; }
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.top h1 { font-size: clamp(22px, 3vw, 30px); flex: 1; }
.lede { color: var(--muted); max-width: 68ch; margin: 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; }
.stat b { font: 700 15px var(--f-display); }
.bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--surface-2); }
.bar i { display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); padding-block: 10px; z-index: 2; }
.filters .grp { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
.filters .grp button { background: none; border: 0; color: var(--muted); padding: 5px 10px; border-radius: 6px; }
.filters .grp button.on { background: var(--surface-2); color: var(--fg); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { width: 100%; border-collapse: collapse; min-width: 720px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--surface); position: sticky; top: 0; }
tr.cat td { background: var(--surface); font: 700 13px var(--f-display); color: var(--fg); }
td.note { color: var(--muted); max-width: 46ch; }
.st { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.st.ada { background: #1d3a2c; color: var(--ok); } .st.sebagian { background: #3d3216; color: var(--accent); } .st.akun { background: #183544; color: var(--select); } .st.tidak { background: #3a1f22; color: #f08b8b; }
.tier.terbatas { background: #3d3216; color: var(--accent); }
.app { font: 600 11px var(--f-mono); color: var(--muted); }
.src { color: var(--muted); font-size: 12px; display: grid; gap: 4px; }
.src a { color: var(--fg); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><button class="btn" id="back"></button><h1>Fitur Canva & CapCut: Free, Pro, dan di Rakit</h1></div>
  <p class="lede" id="disc"></p>
  <div class="stats" id="stats"></div>
  <div class="legend" id="legend"></div>
  <div class="filters">
    <div class="grp" id="fApp"><button data-v="" class="on">Semua</button><button data-v="canva">Canva</button><button data-v="capcut">CapCut</button></div>
    <div class="grp" id="fTier"><button data-v="" class="on">Semua paket</button><button data-v="free">Gratis</button><button data-v="terbatas">Terbatas</button><button data-v="pro">Pro</button></div>
    <div class="grp" id="fSt"><button data-v="" class="on">Semua status</button><button data-v="ada">Ada</button><button data-v="sebagian">Sebagian</button><button data-v="akun">Lewat akun</button><button data-v="tidak">Tidak</button></div>
    <input type="search" id="q" placeholder="Cari fitur" style="min-width:180px">
  </div>
  <div class="tablewrap"><table><thead><tr><th>Fitur</th><th>Paket di aplikasi asli</th><th>Status di Rakit</th><th>Catatan</th></tr></thead><tbody id="rows"></tbody></table></div>
  <div class="src" id="src"></div>
</div>
<script src="studio.js"></script>
<script>
const $ = s => document.querySelector(s);
$('#back').innerHTML = `${icon('back')} Beranda`; $('#back').onclick = () => Studio.go('./');
const TIER = {free: ['free', 'Gratis'], terbatas: ['terbatas', 'Gratis terbatas'], pro: ['pro', 'Pro']}, ST = {ada: 'Ada', sebagian: 'Sebagian', akun: 'Lewat akun Anda', tidak: 'Tidak ada'};
const COL = {ada: 'var(--ok)', sebagian: 'var(--accent)', akun: 'var(--select)', tidak: '#f08b8b'};
let F = null; const f = {app: '', tier: '', st: '', q: ''};
for (const [id, k] of [['fApp', 'app'], ['fTier', 'tier'], ['fSt', 'st']]) $('#' + id).onclick = e => { const b = e.target.closest('button'); if (!b) return; f[k] = b.dataset.v; [...$('#' + id).children].forEach(x => x.classList.toggle('on', x === b)); draw(); };
$('#q').oninput = e => { f.q = e.target.value.toLowerCase(); draw(); };
function draw() {
  const list = F.features.filter(x => (!f.app || x.app === f.app) && (!f.tier || x.tier === f.tier) && (!f.st || x.studio === f.st) && (!f.q || (x.name + x.note + x.cat).toLowerCase().includes(f.q)));
  let h = '', lastCat = '';
  for (const x of list) {
    const cat = `${x.app === 'canva' ? 'Canva' : 'CapCut'} · ${x.cat}`; if (cat !== lastCat) { h += `<tr class="cat"><td colspan="4">${esc(cat)}</td></tr>`; lastCat = cat; }
    h += `<tr><td>${esc(x.name)}</td><td><span class="tier ${TIER[x.tier][0]}">${TIER[x.tier][1]}</span></td><td><span class="st ${x.studio}">${ST[x.studio]}</span></td><td class="note">${esc(x.note)}</td></tr>`;
  }
  $('#rows').innerHTML = h || '<tr><td colspan="4" style="color:var(--muted)">Tidak ada fitur yang cocok dengan filter.</td></tr>';
}
fetch('features.json').then(r => r.json()).then(j => {
  F = j; $('#disc').textContent = `${j.disclaimer} Terakhir diperbarui ${j.updated}.`;
  $('#stats').innerHTML = ['canva', 'capcut'].map(app => {
    const xs = j.features.filter(x => x.app === app), n = s => xs.filter(x => x.studio === s).length;
    return `<div class="stat"><b>${app === 'canva' ? 'Canva' : 'CapCut'} · ${xs.length} fitur</b><div class="bar">${Object.keys(ST).map(s => `<i style="width:${n(s) / xs.length * 100}%;background:${COL[s]}"></i>`).join('')}</div>
      <span style="color:var(--muted);font-size:12px">${Object.keys(ST).map(s => `${n(s)} ${ST[s].toLowerCase()}`).join(' · ')}</span>
      <span style="color:var(--muted);font-size:12px">Paket asli: ${xs.filter(x => x.tier === 'free').length} gratis, ${xs.filter(x => x.tier === 'terbatas').length} terbatas, ${xs.filter(x => x.tier === 'pro').length} Pro</span></div>`; }).join('');
  $('#legend').innerHTML = Object.entries(j.legend.studio).map(([k, v]) => `<span><span class="st ${k}">${ST[k]}</span>${esc(v)}</span>`).join('');
  $('#src').innerHTML = '<b style="color:var(--fg)">Sumber</b>' + j.sources.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join('');
  draw();
}).catch(() => { $('#rows').innerHTML = '<tr><td colspan="4">Daftar fitur gagal dimuat.</td></tr>'; });
</script>
</body>
</html>
